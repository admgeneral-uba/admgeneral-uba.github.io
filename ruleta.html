<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ruleta · Área docente</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
.wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.rueda{position:relative;width:min(100%,560px);margin:0 auto;aspect-ratio:1}
.rueda svg{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.75,.12,1)}
.puntero{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.centro{position:absolute;inset:0;margin:auto;width:16%;height:16%;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.gan{text-align:center;min-height:72px;margin-top:16px}
.gan b{font-family:var(--serif);font-size:clamp(30px,4vw,44px);display:block;line-height:1.1}
.lista{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:10px}
.lista label{display:flex;gap:10px;align-items:center;padding:6px 4px;border-radius:6px;cursor:pointer}
.lista label:hover{background:var(--soft)}
.lista input{width:18px;height:18px;accent-color:var(--ink)}
@media (prefers-reduced-motion:reduce){.rueda svg{transition-duration:.01s}}
</style>
</head>
<body>
<script type="module">
import { iniciar, db, F, esc, toast, $, leerClases, leerTomadas } from "./app.js";
const COL = ["#C2307E", "#1F6FB8", "#6A4FC4", "#1E2550", "#1A7FA8", "#A8286E"];

iniciar({ area: "docente", activo: "Recursos", titulo: "Ruleta de nombres", fondo: "intenso" }, async (user, main) => {
  const [clases, tomadas, est] = await Promise.all([leerClases(), leerTomadas(), F.getDocs(F.collection(db, "estudiantes"))]);
  const todos = est.docs.map(d => { const x = d.data(), p = x.perfil || {}; return { uid: d.id, n: p.apodo || p.nombre || (x.nombreGoogle || "").split(" ")[0] || x.email, full: [p.nombre, p.apellido].filter(Boolean).join(" ") || x.nombreGoogle || x.email }; }).sort((a, b) => a.full.localeCompare(b.full, "es"));
  const conAsis = clases.filter(c => tomadas[c.id]).reverse();
  let marcados = new Set(todos.map(t => t.uid)), giro = 0, girando = false;

  main.innerHTML = `<div class="wrap"><div class="card"><div class="rueda"><div class="puntero"></div><svg id="svg" viewBox="-100 -100 200 200" aria-hidden="true"></svg><div class="centro"></div></div>
      <div class="gan" id="gan" role="status" aria-live="polite"></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="girar" type="button" style="font-size:20px;padding:12px 28px">Girar</button></div></div>
    <div class="card"><h2>Participantes</h2>
      <select id="fuente" aria-label="Quiénes participan"><option value="todos">Todos los estudiantes</option>${conAsis.map(c => `<option value="${c.id}">Presentes en la clase ${c.n}</option>`).join("")}</select>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="sacar" checked style="width:18px;height:18px">Sacar de la ruleta a quien sale</label>
      <div class="lista" id="lista"></div></div></div>`;

  const activos = () => todos.filter(t => marcados.has(t.uid));
  function rueda(){
    const A = activos(), n = A.length, svg = $("#svg");
    if(!n){ svg.innerHTML = '<circle r="98" fill="#ECEBF1"/>'; $("#girar").disabled = true; return; }
    $("#girar").disabled = false;
    if(n === 1){ svg.innerHTML = `<circle r="98" fill="${COL[0]}"/><text x="0" y="-55" fill="#fff" font-size="12" font-weight="700" text-anchor="middle" font-family="Calibri,Carlito,sans-serif">${esc(A[0].n)}</text>`; return; }
    const a = 2 * Math.PI / n, fs = Math.max(4, Math.min(11, 160 / n));
    svg.innerHTML = A.map((t, i) => {
      const a0 = i * a - Math.PI / 2, a1 = a0 + a, x0 = 98 * Math.cos(a0), y0 = 98 * Math.sin(a0), x1 = 98 * Math.cos(a1), y1 = 98 * Math.sin(a1);
      const m = (a0 + a1) / 2, deg = m * 180 / Math.PI, col = COL[i % COL.length === 0 && i === n - 1 && n % COL.length === 1 ? 1 : i % COL.length];
      const name = t.n.length > 14 ? t.n.slice(0, 13) + "…" : t.n;
      return `<path d="M0 0 L${x0} ${y0} A98 98 0 ${a > Math.PI ? 1 : 0} 1 ${x1} ${y1} Z" fill="${col}" stroke="#fff" stroke-width=".6"/>
        <text transform="rotate(${deg}) translate(90 0)" fill="#fff" font-size="${fs}" font-weight="700" text-anchor="end" dominant-baseline="middle" font-family="Calibri,Carlito,sans-serif">${esc(name)}</text>`;
    }).join("");
  }
  function lista(){
    $("#lista").innerHTML = todos.length ? todos.map(t => `<label><input type="checkbox" data-u="${t.uid}"${marcados.has(t.uid) ? " checked" : ""}>${esc(t.full)}</label>`).join("") : '<p class="empty">Todavía no ingresó ningún estudiante.</p>';
    $("#lista").querySelectorAll("[data-u]").forEach(c => c.onchange = () => { c.checked ? marcados.add(c.dataset.u) : marcados.delete(c.dataset.u); rueda(); });
  }
  $("#fuente").onchange = async () => {
    const v = $("#fuente").value;
    if(v === "todos") marcados = new Set(todos.map(t => t.uid));
    else { const s = await F.getDocs(F.query(F.collection(db, "asistencias"), F.where("sesion", "==", v))); marcados = new Set(s.docs.map(d => d.data().uid)); }
    lista(); rueda(); $("#gan").innerHTML = "";
  };
  $("#girar").onclick = () => {
    const A = activos(); if(!A.length || girando) return;
    girando = true; $("#girar").disabled = true; $("#gan").innerHTML = "";
    const i = Math.floor(Math.random() * A.length), a = 360 / A.length;
    const destino = 360 - (i * a + a / 2) + (Math.random() - .5) * a * .6;
    giro += 360 * 6 + ((destino - giro % 360) + 360) % 360;
    const svg = $("#svg"); svg.style.transform = `rotate(${giro}deg)`;
    setTimeout(() => {
      const t = A[i]; $("#gan").innerHTML = `<b>${esc(t.n)}</b><span class="muted">${esc(t.full)}</span>`;
      girando = false;
      if($("#sacar").checked){ marcados.delete(t.uid); setTimeout(() => { lista(); svg.style.transition = "none"; giro = 0; svg.style.transform = "rotate(0deg)"; svg.offsetWidth; svg.style.transition = ""; rueda(); }, 1800); }
      else $("#girar").disabled = false;
    }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 5100);
  };
  lista(); rueda();
});
</script>
</body>
</html>
