:root{
  --bg:#F7F5FB; --paper:#FFFFFF; --ink:#1E2550; --ink2:#2E3566; --muted:#5A5F78; --line:#E2DEEE; --soft:#EEEAF8; --field:#CFC9E3;
  --primary:#1E2550; --primary-ink:#FFFFFF; --live:#D6489A; --live-ink:#A8286E; --ok:#1E7A55; --ok-bg:#E2F3EA;
  --hero-veil:transparent; --nav-bg:rgba(255,255,255,.8);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}}
:root[data-theme="dark"]{
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.serif{font-family:Cambria,Caladea,Georgia,serif}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.hide{display:none!important}

/* header */
.hero{background:linear-gradient(var(--hero-veil),var(--hero-veil)),#E9B5D0 url(img/fondo-intenso.jpg?v=2) center/cover no-repeat}
.hero .in{max-width:1180px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:52px;height:52px}
.brand span{font-weight:700;background:var(--nav-bg);border-radius:8px;padding:4px 10px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--nav-bg);border-radius:12px;padding:4px}
nav a{padding:8px 14px;border-radius:9px;text-decoration:none}
nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.back{font-size:16px;text-decoration:none;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}
h1{margin:4px 0 0;font-size:clamp(32px,5vw,42px);line-height:1.05}


.wrap{max-width:1180px;margin:0 auto;padding:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:1px solid var(--field);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.link{border:0;background:none;padding:6px 8px;color:var(--muted);font-weight:700;text-decoration:underline}
.btn.big{font-size:20px;padding:14px 26px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.demo-pill{display:inline-flex;font-size:14px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:20px;padding:4px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:80;font-size:16px}
h2{margin:0;font-size:26px}
label.l{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:10px 12px}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}
.qcard{display:flex;flex-direction:column;gap:6px}
.qcard h3{margin:0;font-size:21px;line-height:1.2}
.qcard .row{margin-top:auto;padding-top:10px}

/* editor */
.qedit{border-top:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:12px}
.qedit:first-of-type{border-top:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qhead b{font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.optin{display:flex;align-items:center;gap:8px;border:1px solid var(--field);border-radius:10px;padding:4px 4px 4px 10px;background:var(--bg)}
.optin.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.optin input[type=text]{border:0;background:transparent;padding:8px 6px}
.optin input[type=radio]{width:20px;height:20px;accent-color:var(--ok);flex:none;margin:0}
.optin .ltr{width:28px;height:28px;border-radius:7px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.small{font-size:14px}

/* game */
body.game header.hero{display:none}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.gbar .t{font-weight:700;color:var(--ink2)}
.screen{background:#FFFFFF;color:#1E2550;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,36px);min-height:calc(100vh - 140px);display:flex;flex-direction:column;gap:22px}
body.proj .wrap{max-width:none;padding:16px 24px}
body.proj .screen{border:0;min-height:calc(100vh - 90px)}
.screen h2{font-size:clamp(28px,3.4vw,46px);line-height:1.15;color:#1E2550}
.kick{font-size:18px;font-weight:700;color:#A8286E}
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:760px){.lobby{grid-template-columns:minmax(0,1fr)}}
.qr{background:#fff;line-height:0}
.join{font-size:18px;color:#5A5F78;margin-top:10px;word-break:break-all;max-width:280px}
.players{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.pchip{background:#EEEAF8;border-radius:24px;padding:8px 16px;font-weight:700;font-size:20px;animation:pin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:scale(.6)}}
.bigcount{font-family:Cambria,Caladea,Georgia,serif;font-size:56px;font-weight:700;line-height:1}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:16px}
.timer{width:92px;height:92px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cambria,Caladea,Georgia,serif;font-size:40px;font-weight:700;color:#1E2550;background:conic-gradient(#D6489A var(--p,100%),#EEEAF8 0)}
.timer span{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:auto}
@media (max-width:640px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{border-radius:14px;padding:22px 22px;color:#fff;font-size:clamp(20px,2.2vw,28px);font-weight:700;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;min-height:96px}
.tile .ltr{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.tile .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.18);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tile .cnt{margin-left:auto;font-size:.9em;position:relative}
.tile > *{position:relative}
.tile.dim{opacity:.35}
.tile .chk{width:34px;height:34px;border-radius:50%;background:#fff;color:#1E7A55;display:flex;align-items:center;justify-content:center;flex:none}
.answered{font-size:20px;color:#5A5F78}
.rank{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:#F7F5FB;border-radius:12px;padding:10px 16px;font-size:22px}
.rrow b.pos{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;color:#A8286E}
.rrow .pts{font-weight:700;font-variant-numeric:tabular-nums}
.rrow .up{font-size:15px;color:#1E7A55;font-weight:700;margin-left:8px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;max-width:820px;width:100%;margin:10px auto 0}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.step .who{font-size:clamp(20px,2.4vw,30px);font-weight:700;word-break:break-word}
.step .pp{color:#5A5F78;font-size:18px}
.step .base{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-family:Cambria,Caladea,Georgia,serif;font-size:48px;font-weight:700;color:#fff}
.step.p1 .base{height:220px;background:#D6489A}.step.p2 .base{height:160px;background:#5A62C8}.step.p3 .base{height:120px;background:#2B8FD9}
@media (prefers-reduced-motion:no-preference){.step .base{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}.step.p2 .base{animation-delay:.3s}.step.p1 .base{animation-delay:.6s}}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>
</head>

<div class="wrap"><div id="app"></div></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script type="module">
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); };
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
const JOIN = new URL("participar.html", location.href).href.split("?")[0];
const OPT = [{ c: "#C2307E", l: "A" }, { c: "#1F6FB8", l: "B" }, { c: "#6A4FC4", l: "C" }, { c: "#1E2550", l: "D" }];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const SAMPLE = { id: "ejemplo", titulo: "Unidad II · La administración", preguntas: [
  { texto: "¿Qué mide la eficacia?", opciones: ["El logro de los objetivos", "El uso óptimo de los recursos", "La cantidad de empleados", "La velocidad de los procesos"], correcta: 0, tiempo: 20 },
  { texto: "¿Cuál NO es una de las funciones de la administración?", opciones: ["Planeación", "Organización", "Facturación", "Control"], correcta: 2, tiempo: 20 },
  { texto: "Según Bunge, ¿cómo debe entenderse la administración?", opciones: ["Como una ciencia básica", "Como una sociotecnología", "Como un arte", "Como una técnica de persuasión"], correcta: 1, tiempo: 20 },
  { texto: "Una empresa usó la mitad de los recursos previstos, pero no cumplió su meta. Fue…", opciones: ["Eficaz, pero no eficiente", "Eficiente, pero no eficaz", "Eficaz y eficiente", "Ni eficaz ni eficiente"], correcta: 1, tiempo: 30 },
  { texto: "¿Qué hacen los gerentes de primera línea?", opciones: ["Definen la estrategia de toda la organización", "Dirigen el trabajo de los empleados operativos", "Coordinan a los gerentes de nivel medio", "No tienen personal a cargo"], correcta: 1, tiempo: 20 }
]};

/* =========== data layer: Firebase or demo =========== */
let fb = null, F = null, demo = false, user = null;
const api = {
  async list(){
    if(demo){ try{ const l = JSON.parse(store.get("quiz_lib") || "null"); if(l && l.length) return l; }catch(e){} return [SAMPLE]; }
    const s = await F.getDocs(F.query(F.collection(fb.db, "quizzes"), F.orderBy("creado", "desc")));
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async save(q){
    if(demo){ const l = await api.list(); const i = l.findIndex(x => x.id === q.id); if(i >= 0) l[i] = q; else l.unshift(q); store.set("quiz_lib", JSON.stringify(l)); return q.id; }
    const id = q.id || "q" + Date.now().toString(36);
    const data = { titulo: q.titulo, preguntas: q.preguntas, creado: q.creado || F.serverTimestamp() };
    await F.setDoc(F.doc(fb.db, "quizzes", id), data); return id;
  },
  async remove(id){
    if(demo){ const l = (await api.list()).filter(x => x.id !== id); store.set("quiz_lib", JSON.stringify(l)); return; }
    await F.deleteDoc(F.doc(fb.db, "quizzes", id));
  }
};

/* =========== library =========== */
let lib = [];
async function showLib(){
  document.body.classList.remove("game", "proj");
  app.innerHTML = `<div class="row between"><h2 class="serif">Tus quizzes</h2><div class="row">${demo ? '<span class="demo-pill">Modo de ejemplo</span>' : ""}<button class="btn primary" id="new" type="button">Nuevo quiz</button></div></div><div class="lib" id="lib"><p class="muted">Cargando…</p></div>`;
  $("#new").onclick = () => showEditor({ id: "", titulo: "", preguntas: [blankQ()] });
  try{ lib = await api.list(); }catch(e){ console.error(e); $("#lib").innerHTML = '<p class="muted">No se pudieron cargar los quizzes.</p>'; return; }
  if(!lib.length){ $("#lib").innerHTML = '<div class="panel"><p class="muted" style="margin:0">Todavía no armaste ningún quiz. Tocá “Nuevo quiz” para empezar.</p></div>'; return; }
  $("#lib").innerHTML = lib.map((q, i) => `<section class="panel qcard"><h3 class="serif">${esc(q.titulo || "Sin título")}</h3><span class="muted">${q.preguntas.length} ${q.preguntas.length === 1 ? "pregunta" : "preguntas"}</span>
    <div class="row"><button class="btn primary" data-play="${i}" type="button">Jugar</button><button class="btn" data-edit="${i}" type="button">Editar</button><button class="btn link" data-del="${i}" type="button">Eliminar</button></div></section>`).join("");
  app.querySelectorAll("[data-play]").forEach(b => b.onclick = () => startGame(lib[+b.dataset.play]));
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => showEditor(JSON.parse(JSON.stringify(lib[+b.dataset.edit]))));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if(!confirm("¿Eliminar este quiz?")) return; try{ await api.remove(lib[+b.dataset.del].id); showLib(); }catch(e){ toast("No se pudo eliminar."); } });
}

/* =========== editor =========== */
const blankQ = () => ({ texto: "", opciones: ["", "", "", ""], correcta: 0, tiempo: 20 });
function showEditor(q){
  const draw = () => {
    app.innerHTML = `<div class="row between" style="margin-bottom:16px"><h2 class="serif">${q.id ? "Editar quiz" : "Nuevo quiz"}</h2><button class="btn link" id="cancel" type="button">Cancelar</button></div>
    <section class="panel"><label class="l" for="tt">Título</label><input type="text" id="tt" maxlength="80" value="${esc(q.titulo)}" placeholder="Por ejemplo: Unidad II · La administración">
    <div id="qs" style="margin-top:8px">${q.preguntas.map((p, i) => `<div class="qedit">
      <div class="qhead"><b>Pregunta ${i + 1}</b><div class="row"><label class="small muted" for="t${i}">Tiempo</label><select id="t${i}" data-t="${i}" style="width:auto">${[10, 20, 30, 45, 60].map(s => `<option value="${s}"${s === p.tiempo ? " selected" : ""}>${s} s</option>`).join("")}</select>${q.preguntas.length > 1 ? `<button class="btn link" data-rm="${i}" type="button">Quitar</button>` : ""}</div></div>
      <textarea data-q="${i}" rows="2" maxlength="200" aria-label="Texto de la pregunta ${i + 1}" placeholder="Escribí la pregunta">${esc(p.texto)}</textarea>
      <div class="opts">${p.opciones.map((o, j) => `<label class="optin${p.correcta === j ? " ok" : ""}"><span class="ltr" style="background:${OPT[j].c}">${OPT[j].l}</span><input type="text" data-o="${i}-${j}" maxlength="90" value="${esc(o)}" placeholder="Opción ${OPT[j].l}" aria-label="Opción ${OPT[j].l} de la pregunta ${i + 1}"><input type="radio" name="c${i}" data-c="${i}-${j}"${p.correcta === j ? " checked" : ""} aria-label="Marcar ${OPT[j].l} como correcta"></label>`).join("")}</div>
      <span class="small muted">Marcá con el círculo la opción correcta.</span></div>`).join("")}</div>
    <div class="row between" style="margin-top:8px"><button class="btn" id="addq" type="button">Agregar pregunta</button><button class="btn primary big" id="save" type="button">Guardar quiz</button></div>
    <p id="err" style="color:#B3413A;margin:10px 0 0;min-height:1.3em"></p></section>`;
    $("#cancel").onclick = showLib;
    $("#tt").oninput = e => q.titulo = e.target.value;
    app.querySelectorAll("[data-q]").forEach(el => el.oninput = () => q.preguntas[+el.dataset.q].texto = el.value);
    app.querySelectorAll("[data-o]").forEach(el => el.oninput = () => { const [i, j] = el.dataset.o.split("-").map(Number); q.preguntas[i].opciones[j] = el.value; });
    app.querySelectorAll("[data-c]").forEach(el => el.onchange = () => { const [i, j] = el.dataset.c.split("-").map(Number); q.preguntas[i].correcta = j; draw(); });
    app.querySelectorAll("[data-t]").forEach(el => el.onchange = () => q.preguntas[+el.dataset.t].tiempo = +el.value);
    app.querySelectorAll("[data-rm]").forEach(el => el.onclick = () => { q.preguntas.splice(+el.dataset.rm, 1); draw(); });
    $("#addq").onclick = () => { q.preguntas.push(blankQ()); draw(); app.querySelectorAll("[data-q]")[q.preguntas.length - 1].focus(); };
    $("#save").onclick = async () => {
      const err = $("#err");
      if(!q.titulo.trim()){ err.textContent = "Ponele un título al quiz."; return; }
      const bad = q.preguntas.findIndex(p => !p.texto.trim() || p.opciones.filter(o => o.trim()).length < 2 || !p.opciones[p.correcta].trim());
      if(bad >= 0){ err.textContent = `Revisá la pregunta ${bad + 1}: necesita texto, al menos dos opciones y la correcta completa.`; return; }
      q.preguntas.forEach(p => p.opciones = p.opciones.map(o => o.trim()));
      if(demo && !q.id) q.id = "q" + Date.now().toString(36);
      try{ await api.save(q); toast("Quiz guardado"); showLib(); }catch(e){ console.error(e); err.textContent = "No se pudo guardar. Probá de nuevo."; }
    };
  };
  draw();
}

/* =========== game =========== */
let G = null;
const PTS = (ok, ms, lim) => ok ? Math.round(500 + 500 * Math.max(0, 1 - ms / (lim * 1000))) : 0;
async function startGame(quiz){
  G = { quiz, pid: "p" + Date.now().toString(36), estado: "lobby", idx: -1, players: new Map(), answers: new Map(), inicioTs: 0, unsub: [], sim: [] };
  document.body.classList.add("game");
  if(!demo){
    try{
      await F.setDoc(F.doc(fb.db, "partidas", G.pid), { quizId: quiz.id, titulo: quiz.titulo, estado: "lobby", idx: -1, tiempo: 0, activa: true, creada: F.serverTimestamp() });
      await publish({});
      G.unsub.push(F.onSnapshot(F.collection(fb.db, "partidas", G.pid, "jugadores"), s => { s.docs.forEach(d => { if(!G.players.has(d.id)) G.players.set(d.id, { apodo: d.data().apodo, puntos: 0, aciertos: 0, prev: 0 }); }); refresh(); }));
      G.unsub.push(F.onSnapshot(F.collection(fb.db, "partidas", G.pid, "respuestas"), s => { s.docs.forEach(d => { const r = d.data(); if(!G.answers.has(r.idx)) G.answers.set(r.idx, new Map()); G.answers.get(r.idx).set(r.disp, { opcion: r.opcion, hora: r.hora && r.hora.toMillis ? r.hora.toMillis() : Date.now() }); }); refresh(); }));
      G.unsub.push(F.onSnapshot(F.doc(fb.db, "partidas", G.pid), s => { const d = s.data(); if(d && d.inicioTs && d.inicioTs.toMillis) G.inicioTs = d.inicioTs.toMillis(); }));
    }catch(e){ console.error(e); toast("No se pudo crear la partida. Revisá las reglas de Firebase."); return endGame(); }
  } else simJoin();
  draw();
}
function publish(extra){
  if(demo) return Promise.resolve();
  const q = G.quiz.preguntas[G.idx];
  const base = { tipo: "quiz", id: G.pid, titulo: G.quiz.titulo, estado: G.estado, idx: G.idx, total: G.quiz.preguntas.length, activa: G.estado !== "cerrado" };
  if(q && G.estado !== "lobby") Object.assign(base, { pregunta: q.texto, opciones: q.opciones, tiempo: q.tiempo });
  return F.setDoc(F.doc(fb.db, "publico", "dinamica"), Object.assign(base, extra)).catch(e => console.error(e));
}
async function setPartida(patch){ if(demo) return; try{ await F.updateDoc(F.doc(fb.db, "partidas", G.pid), patch); }catch(e){ console.error(e); } }
const ranking = () => [...G.players.entries()].map(([id, p]) => ({ id, ...p })).sort((a, b) => b.puntos - a.puntos || b.aciertos - a.aciertos || a.apodo.localeCompare(b.apodo));

async function nextQuestion(){
  G.idx++; G.estado = "pregunta"; G.startLocal = Date.now();
  const q = G.quiz.preguntas[G.idx];
  if(!demo){ G.inicioTs = 0; await setPartida({ estado: "pregunta", idx: G.idx, tiempo: q.tiempo, inicioTs: F.serverTimestamp() }); await publish({ inicioMs: Date.now() }); }
  else simAnswers(q);
  draw(); tick();
}
function tick(){
  clearTimeout(G.tickId);
  if(G.estado !== "pregunta") return;
  const q = G.quiz.preguntas[G.idx], left = q.tiempo * 1000 - (Date.now() - G.startLocal);
  const el = $("#tmr");
  if(el){ el.style.setProperty("--p", Math.max(0, left / (q.tiempo * 1000) * 100) + "%"); el.querySelector("span").textContent = Math.max(0, Math.ceil(left / 1000)); }
  const ans = G.answers.get(G.idx), n = ans ? ans.size : 0;
  if(left <= 0 || (G.players.size && n >= G.players.size)) return showResult();
  G.tickId = setTimeout(tick, 200);
}
async function showResult(){
  clearTimeout(G.tickId);
  if(G.estado !== "pregunta") return;
  G.estado = "resultado";
  const q = G.quiz.preguntas[G.idx], ans = G.answers.get(G.idx) || new Map();
  const t0 = demo ? 0 : (G.inicioTs || G.startLocal);
  G.players.forEach(p => p.prev = p.puntos);
  ans.forEach((a, id) => { const p = G.players.get(id); if(!p) return; const ok = a.opcion === q.correcta; p.puntos += PTS(ok, demo ? a.ms : a.hora - t0, q.tiempo); if(ok) p.aciertos++; });
  const rk = ranking();
  if(!demo){
    const puntajes = {}; rk.forEach((p, i) => puntajes[p.id] = { puntos: p.puntos, pos: i + 1 });
    await setPartida({ estado: "resultado" });
    await publish({ correcta: q.correcta, puntajes, top: rk.slice(0, 5).map(p => ({ apodo: p.apodo, puntos: p.puntos })) });
  }
  draw();
}
async function finish(){
  G.estado = "fin";
  const rk = ranking();
  if(!demo){
    const puntajes = {}; rk.forEach((p, i) => puntajes[p.id] = { puntos: p.puntos, pos: i + 1 });
    await setPartida({ estado: "fin", activa: false });
    await publish({ puntajes, top: rk.slice(0, 5).map(p => ({ apodo: p.apodo, puntos: p.puntos })), activa: true });
  }
  draw(); if(!reduce) setTimeout(confetti, 900);
}
async function endGame(){
  if(G){
    clearTimeout(G.tickId); G.sim.forEach(clearTimeout); G.unsub.forEach(u => u());
    if(!demo){ try{ await setPartida({ activa: false }); await F.setDoc(F.doc(fb.db, "publico", "dinamica"), { tipo: "quiz", id: G.pid, activa: false }); }catch(e){ console.error(e); } }
  }
  G = null; if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); showLib();
}
function refresh(){
  if(!G) return;
  if(G.estado === "lobby") draw();
  else if(G.estado === "pregunta"){ const n = (G.answers.get(G.idx) || new Map()).size; const el = $("#answered"); if(el) el.textContent = `${n} de ${G.players.size} respondieron`; }
}
function csv(){
  const rk = ranking(), rows = [["Posición", "Apodo", "Puntos", "Aciertos"], ...rk.map((p, i) => [i + 1, p.apodo, p.puntos, p.aciertos])];
  const txt = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })); a.download = "quiz-resultados.csv"; document.body.appendChild(a); a.click(); a.remove();
}

function bar(){
  return `<div class="gbar"><span class="t">${esc(G.quiz.titulo)}${demo ? ' <span class="demo-pill" style="margin-left:8px">Modo de ejemplo</span>' : ""}</span><div class="row">
    <button class="btn" id="fs" type="button">${document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa"}</button><button class="btn" id="quit" type="button">Terminar</button></div></div>`;
}
function draw(){
  if(!G) return;
  const q = G.quiz.preguntas[G.idx], N = G.quiz.preguntas.length;
  let body = "";
  if(G.estado === "lobby"){
    const url = demo ? "https://tu-usuario.github.io/tu-sitio/participar.html" : JOIN;
    body = `<div class="lobby"><div><div class="qr" id="qr"></div><p class="join">Entrá a <b>${esc(url.replace(/^https?:\/\//, ""))}</b> y elegí tu apodo</p></div>
      <div style="display:flex;flex-direction:column;gap:18px"><span class="kick">Esperando jugadores</span><h2 class="serif">${esc(G.quiz.titulo)}</h2>
      <div class="row" style="gap:14px;align-items:baseline"><span class="bigcount">${G.players.size}</span><span style="font-size:20px">${G.players.size === 1 ? "jugador" : "jugadores"}</span></div>
      <div class="players">${[...G.players.values()].map(p => `<span class="pchip">${esc(p.apodo)}</span>`).join("")}</div>
      <div><button class="btn primary big" id="go" type="button"${G.players.size ? "" : " disabled"}>Empezar</button></div></div></div>`;
  } else if(G.estado === "pregunta"){
    const n = (G.answers.get(G.idx) || new Map()).size;
    body = `<div class="qtop"><span class="kick">Pregunta ${G.idx + 1} de ${N}</span><div class="timer" id="tmr"><span>${q.tiempo}</span></div></div>
      <h2 class="serif">${esc(q.texto)}</h2><span class="answered" id="answered">${n} de ${G.players.size} respondieron</span>
      <div class="tiles">${q.opciones.map((o, j) => o ? `<div class="tile" style="background:${OPT[j].c}"><span class="ltr">${OPT[j].l}</span><span>${esc(o)}</span></div>` : "").join("")}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="stop" type="button">Mostrar resultado</button></div>`;
  } else if(G.estado === "resultado"){
    const ans = G.answers.get(G.idx) || new Map(), counts = [0, 0, 0, 0]; ans.forEach(a => counts[a.opcion]++);
    const tot = Math.max(1, ans.size), rk = ranking().slice(0, 5);
    body = `<div class="qtop"><span class="kick">Pregunta ${G.idx + 1} de ${N}</span><span class="answered">${ans.size} ${ans.size === 1 ? "respuesta" : "respuestas"}</span></div>
      <h2 class="serif">${esc(q.texto)}</h2>
      <div class="tiles" style="margin-top:0">${q.opciones.map((o, j) => o ? `<div class="tile${j === q.correcta ? "" : " dim"}" style="background:${OPT[j].c}"><span class="fill" style="width:${Math.round(counts[j] / tot * 100)}%"></span>${j === q.correcta ? `<span class="chk">${CHECK}</span>` : `<span class="ltr">${OPT[j].l}</span>`}<span>${esc(o)}</span><span class="cnt">${counts[j]}</span></div>` : "").join("")}</div>
      <div><span class="kick" style="display:block;margin-bottom:10px">Ranking</span><div class="rank">${rk.map((p, i) => `<div class="rrow"><b class="pos">${i + 1}</b><span>${esc(p.apodo)}${p.puntos > p.prev ? `<span class="up">+${p.puntos - p.prev}</span>` : ""}</span><span class="pts">${p.puntos}</span></div>`).join("") || '<p class="muted">Nadie respondió esta pregunta.</p>'}</div></div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary big" id="next" type="button">${G.idx + 1 < N ? "Siguiente pregunta" : "Ver el podio"}</button></div>`;
  } else if(G.estado === "fin"){
    const rk = ranking(), top = [rk[1], rk[0], rk[2]];
    body = `<div style="text-align:center"><span class="kick">Resultado final</span><h2 class="serif" style="margin-top:6px">${esc(G.quiz.titulo)}</h2></div>
      <div class="podium">${top.map((p, k) => { const pos = [2, 1, 3][k]; return p ? `<div class="step p${pos}"><span class="who">${esc(p.apodo)}</span><span class="pp">${p.puntos} puntos</span><div class="base">${pos}</div></div>` : "<div></div>"; }).join("")}</div>
      ${rk.length > 3 ? `<div class="rank" style="max-width:640px;width:100%;margin:0 auto">${rk.slice(3, 10).map((p, i) => `<div class="rrow"><b class="pos">${i + 4}</b><span>${esc(p.apodo)}</span><span class="pts">${p.puntos}</span></div>`).join("")}</div>` : ""}
      <div class="row" style="justify-content:center"><button class="btn" id="csv" type="button">Descargar resultados</button><button class="btn primary" id="done" type="button">Volver a mis quizzes</button></div>`;
  }
  app.innerHTML = bar() + `<section class="screen" aria-live="polite">${body}</section>`;
  $("#quit").onclick = () => { if(G.estado === "fin" || confirm("¿Terminar la partida?")) endGame(); };
  $("#fs").onclick = () => { if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); };
  if($("#qr") && window.QRCode) new QRCode($("#qr"), { text: demo ? "https://tu-usuario.github.io/tu-sitio/participar.html" : JOIN, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  if($("#go")) $("#go").onclick = nextQuestion;
  if($("#stop")) $("#stop").onclick = showResult;
  if($("#next")) $("#next").onclick = () => G.idx + 1 < N ? nextQuestion() : finish();
  if($("#csv")) $("#csv").onclick = csv;
  if($("#done")) $("#done").onclick = endGame;
}
document.addEventListener("fullscreenchange", () => { document.body.classList.toggle("proj", !!document.fullscreenElement); const b = $("#fs"); if(b) b.textContent = document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa"; });

/* =========== demo simulation =========== */
const NAMES = ["Lu", "Tincho", "Sofi", "Tomi", "Vale", "Joaco", "Cami", "Mateo", "Martu", "Benja", "Juli", "Facu"];
function simJoin(){
  NAMES.forEach((n, i) => G.sim.push(setTimeout(() => { if(!G || G.estado !== "lobby") return; G.players.set("d" + i, { apodo: n, puntos: 0, aciertos: 0, prev: 0 }); draw(); }, 600 + i * 450 + Math.random() * 400)));
}
function simAnswers(q){
  const m = new Map(); G.answers.set(G.idx, m);
  [...G.players.keys()].forEach((id, i) => {
    const skill = .55 + (i % 4) * .1, ms = 2500 + Math.random() * (q.tiempo * 1000 * .6);
    G.sim.push(setTimeout(() => { if(!G || G.estado !== "pregunta") return; const opcion = Math.random() < skill ? q.correcta : [0, 1, 2, 3].filter(x => x !== q.correcta && q.opciones[x])[Math.floor(Math.random() * 3)] ?? q.correcta; m.set(id, { opcion, ms }); refresh(); tick(); }, ms));
  });
}
function confetti(){
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  const cols = OPT.map(o => o.c).concat("#D6489A", "#2B8FD9");
  const parts = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: H * .3, vx: (Math.random() - .5) * 18 * dpr, vy: (-Math.random() * 16 - 6) * dpr, s: (6 + Math.random() * 7) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0, 0, W, H); parts.forEach(p => { p.vy += .45 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }); if(t - t0 < 3000) requestAnimationFrame(f); else ctx.clearRect(0, 0, W, H); })(t0);
}

/* =========== start =========== */
async function connect(){
  try{ fb = await import("./firebase.js"); }catch(e){ fb = null; }
  if(!fb || !fb.configurado){ demo = true; showLib(); return; }
  try{
    F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const { onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    onAuthStateChanged(fb.auth, u => { user = u; if(u) showLib(); else app.innerHTML = '<div class="panel"><h2 class="serif" style="margin-bottom:8px">Ingresá para usar el quiz</h2><p class="muted" style="margin:0">Tus quizzes se guardan en tu cuenta. <a href="docente.html">Ingresar al área docente</a>.</p></div>'; });
  }catch(e){ console.error(e); demo = true; showLib(); }
}
connect();
</script>
