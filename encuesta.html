<style>

:root{
  --bg:#F7F5FB; --paper:#FFFFFF; --ink:#1E2550; --ink2:#2E3566; --muted:#5A5F78; --line:#E2DEEE; --soft:#EEEAF8; --field:#CFC9E3;
  --primary:#1E2550; --primary-ink:#FFFFFF; --live:#D6489A; --live-ink:#A8286E; --ok:#1E7A55; --ok-bg:#E2F3EA;
  --hero-veil:transparent; --nav-bg:rgba(255,255,255,.8);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}}
:root[data-theme="dark"]{
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.serif{font-family:Cambria,Caladea,Georgia,serif}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.hide{display:none!important}

/* header */
.hero{background:linear-gradient(var(--hero-veil),var(--hero-veil)),#E9B5D0 url(img/fondo-intenso.jpg?v=2) center/cover no-repeat}
.hero .in{max-width:1180px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:52px;height:52px}
.brand span{font-weight:700;background:var(--nav-bg);border-radius:8px;padding:4px 10px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--nav-bg);border-radius:12px;padding:4px}
nav a{padding:8px 14px;border-radius:9px;text-decoration:none}
nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.back{font-size:16px;text-decoration:none;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}
h1{margin:4px 0 0;font-size:clamp(32px,5vw,42px);line-height:1.05}


[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:1px solid var(--field);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.link{border:0;background:none;padding:6px 8px;color:var(--muted);text-decoration:underline}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{display:block;font-weight:700;font-size:16px;margin:0 0 8px}
.demo-pill{display:inline-flex;font-size:14px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:20px;padding:4px 12px}
.tip{color:var(--muted);font-size:15px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:80;font-size:16px}

.setup{max-width:760px;margin:12px auto 0}
.setup h2{margin:0;font-size:26px}
.setup input[type=text]{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:11px 14px}
#q{font-size:20px}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.ideas button{font:inherit;font-size:15px;color:var(--ink2);background:var(--soft);border:0;border-radius:20px;padding:6px 14px;cursor:pointer}
.optrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ltr{width:32px;height:32px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);margin-top:14px;cursor:pointer}
.opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.opt b{display:block}.opt span{color:var(--muted);font-size:15px}
.launch{margin-top:16px;font-size:20px;padding:14px 26px}

.live{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.live{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px}
.side .btn{width:100%}
.state{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:20px;padding:4px 12px}
.state::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.state.off{color:var(--muted);background:var(--soft)}
.big{display:flex;align-items:baseline;gap:8px;margin:12px 0 0}
.big b{font-size:48px;line-height:1}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qr{background:#fff;padding:10px;border-radius:10px;line-height:0}
.qrbox p{margin:0;color:var(--muted);font-size:15px;word-break:break-all}
.stage{background:#FFFFFF;color:#1E2550;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:20px;min-height:520px}
.stagebar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.stagebar h2{margin:0;font-size:clamp(26px,3vw,38px);line-height:1.15;flex:1 1 360px}
.stage .btn{background:#fff;color:#1E2550;border-color:#CFC9E3}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center}
.bar .ltr{width:40px;height:40px;font-size:18px}
.bar .track{position:relative;background:#F2EFF8;border-radius:12px;min-height:58px;overflow:hidden;display:flex;align-items:center}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:12px;transition:width .8s cubic-bezier(.2,.8,.2,1);opacity:.9}
.bar .txt{position:relative;padding:12px 16px;font-size:clamp(18px,1.8vw,24px);font-weight:700}
.bar .num{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
.bar .num b{font-family:Cambria,Caladea,Georgia,serif;font-size:clamp(24px,2.4vw,34px)}
.bar .num span{display:block;font-size:15px;color:#5A5F78}
.bar.win .txt::after{content:" ★";color:#A8286E}
.hidden-note{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;flex:1;color:#5A5F78}
.hidden-note b{font-family:Cambria,Caladea,Georgia,serif;font-size:clamp(48px,6vw,80px);color:#1E2550;line-height:1}
.projqr{display:none}
body.proj{background:#FFFFFF}
body.proj header.hero, body.proj .side, body.proj .tip{display:none!important}
body.proj .wrap{max-width:none;padding:20px 32px}
body.proj .live{grid-template-columns:minmax(0,1fr)}
body.proj .stage{border:0;min-height:calc(100vh - 40px)}
body.proj .bar .track{min-height:76px}
body.proj .projqr{display:flex;position:fixed;right:24px;bottom:24px;align-items:center;gap:14px;background:#FFFFFF;border:1px solid #E2DEEE;border-radius:14px;padding:12px 16px;box-shadow:0 6px 20px rgba(30,37,80,.12);color:#1E2550;font-weight:700;font-size:18px;z-index:5}
body.proj .projqr .qr{padding:0}
</style>

<div class="wrap">
  <section class="panel setup" id="setup">

  <div class="live" id="live" hidden>

      <section class="panel">
        <div class="row" style="justify-content:space-between"><span class="state" id="state">Abierta</span><span class="demo-pill" id="demoPill2" hidden>Ejemplo</span></div>
        <div class="big"><b class="serif" id="nVotes">0</b><span id="nLbl">votos</span></div>
      </section>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); };
const JOIN = new URL("participar.html", location.href).href.split("?")[0];
const COL = ["#C2307E", "#1F6FB8", "#6A4FC4", "#1E2550", "#1A7FA8", "#A8286E"];
const L = "ABCDEF";
let opts = ["", "", "", ""], cur = null, votes = [], fb = null, F = null, unsub = null, demo = false, timer = null;

/* ---------- setup ---------- */
function drawOpts(){
  $("#opts").innerHTML = opts.map((o, i) => `<div class="optrow"><span class="ltr" style="background:${COL[i]}">${L[i]}</span><input type="text" data-i="${i}" maxlength="80" value="${esc(o)}" placeholder="Opción ${L[i]}" aria-label="Opción ${L[i]}">${opts.length > 2 ? `<button class="btn link" data-rm="${i}" type="button" aria-label="Quitar opción ${L[i]}">Quitar</button>` : ""}</div>`).join("");
  $("#opts").querySelectorAll("[data-i]").forEach(el => el.oninput = () => opts[+el.dataset.i] = el.value);
  $("#opts").querySelectorAll("[data-rm]").forEach(el => el.onclick = () => { opts.splice(+el.dataset.rm, 1); drawOpts(); });
  $("#addOpt").hidden = opts.length >= 6;
}
document.querySelector(".ideas").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; $("#q").value = b.textContent; opts = b.dataset.o.split("|"); drawOpts(); });
import("./preparados.js").then(m => m.montarPreparados({ tipo: "encuesta",
  leer: () => ({ q: $("#q").value.trim(), opts: opts.map(o => String(o).trim()).filter(Boolean) }),
  aplicar: d => { $("#q").value = d.q || ""; if(d.opts && d.opts.length) { opts = d.opts.slice(); drawOpts(); } } })).catch(e => console.error(e));
$("#addOpt").onclick = () => { if(opts.length < 6){ opts.push(""); drawOpts(); $("#opts").querySelectorAll("input")[opts.length - 1].focus(); } };
$("#launch").onclick = launch;
$("#reset").onclick = reset;
$("#pause").onclick = () => saveCfg({ activa: !cur.activa });
$("#reveal").onclick = () => saveCfg({ ocultar: !cur.ocultar });

function show(v){ $("#setup").hidden = v !== "setup"; $("#live").hidden = v !== "live"; }
function drawQR(){
  const url = demo ? "https://tu-usuario.github.io/tu-sitio/participar.html" : JOIN;
  $("#joinUrl").textContent = $("#joinUrl2").textContent = url.replace(/^https?:\/\//, "");
  for(const [id, size] of [["#qr", 200], ["#qr2", 120]]){ const el = $(id); el.innerHTML = ""; if(window.QRCode) new QRCode(el, { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
}
const publicDoc = () => ({ tipo: "encuesta", id: cur.id, pregunta: cur.pregunta, opciones: cur.opciones, activa: cur.activa });
async function launch(){
  const pregunta = $("#q").value.trim(), opciones = opts.map(o => o.trim()).filter(Boolean);
  if(pregunta.length < 3){ $("#setupMsg").textContent = "Escribí la pregunta."; $("#q").focus(); return; }
  if(opciones.length < 2){ $("#setupMsg").textContent = "Completá al menos dos opciones."; return; }
  $("#setupMsg").textContent = "";
  const ocultar = $("#optHide").checked;
  if(demo){ cur = { id: "demo", pregunta, opciones, ocultar, activa: true }; votes = []; openLive(); simulate(); return; }
  const id = "e" + Date.now().toString(36);
  $("#launch").disabled = true;
  try{
    await F.setDoc(F.doc(fb.db, "encuestas", id), { pregunta, opciones, ocultar, activa: true, creada: F.serverTimestamp() });
    cur = { id, pregunta, opciones, ocultar, activa: true }; votes = [];
    await F.setDoc(F.doc(fb.db, "publico", "dinamica"), publicDoc());
    openLive(); listen();
  }catch(e){ console.error(e); $("#setupMsg").textContent = e.code === "permission-denied" ? "Tu cuenta no tiene permiso. Revisá que hayas ingresado al área docente y que las reglas de Firebase incluyan la encuesta." : "No se pudo lanzar la encuesta. Probá de nuevo."; }
  $("#launch").disabled = false;
}
function openLive(){ $("#qTitle").textContent = cur.pregunta; paintState(); drawQR(); show("live"); render(); }
function paintState(){
  $("#state").textContent = cur.activa ? "Abierta" : "Cerrada"; $("#state").classList.toggle("off", !cur.activa);
  $("#pause").textContent = cur.activa ? "Cerrar votación" : "Reabrir votación";
  $("#reveal").textContent = cur.ocultar ? "Mostrar resultados" : "Ocultar resultados";
}
async function saveCfg(patch){
  Object.assign(cur, patch); paintState(); render();
  if(demo){ if("activa" in patch){ cur.activa ? simulate() : clearTimeout(timer); } return; }
  try{ await F.updateDoc(F.doc(fb.db, "encuestas", cur.id), patch); if("activa" in patch) await F.setDoc(F.doc(fb.db, "publico", "dinamica"), publicDoc()); }
  catch(e){ console.error(e); toast("No se pudo guardar el cambio."); }
}
async function reset(){
  if(cur && cur.activa){
    if(demo) clearTimeout(timer);
    else{ try{ await F.updateDoc(F.doc(fb.db, "encuestas", cur.id), { activa: false }); await F.setDoc(F.doc(fb.db, "publico", "dinamica"), { tipo: "encuesta", id: cur.id, activa: false }); }catch(e){ console.error(e); } }
  }
  if(unsub){ unsub(); unsub = null; }
  cur = null; votes = []; $("#bars").innerHTML = ""; $("#q").value = ""; opts = ["", "", "", ""]; drawOpts(); show("setup");
}

/* ---------- render ---------- */
function render(){
  if(!cur) return;
  const n = votes.length, counts = cur.opciones.map(() => 0);
  votes.forEach(v => { if(counts[v] !== undefined) counts[v]++; });
  $("#nVotes").textContent = n; $("#nLbl").textContent = n === 1 ? "voto" : "votos";
  $("#hiddenNote").hidden = !cur.ocultar; $("#bars").hidden = cur.ocultar; $("#hiddenNum").textContent = n;
  if(cur.ocultar) return;
  const max = Math.max(...counts);
  const bars = $("#bars");
  if(bars.children.length !== cur.opciones.length){
    bars.innerHTML = cur.opciones.map((o, i) => `<div class="bar"><span class="ltr" style="background:${COL[i]}">${L[i]}</span><div class="track"><span class="fill" style="width:0;background:${COL[i]}22"></span><span class="txt">${esc(o)}</span></div><div class="num"><b>0 %</b><span>0 votos</span></div></div>`).join("");
  }
  [...bars.children].forEach((el, i) => {
    const pct = n ? Math.round(counts[i] / n * 100) : 0;
    el.querySelector(".fill").style.width = pct + "%";
    el.querySelector(".fill").style.background = COL[i] + "33";
    el.querySelector(".num b").textContent = pct + " %";
    el.querySelector(".num span").textContent = `${counts[i]} ${counts[i] === 1 ? "voto" : "votos"}`;
    el.classList.toggle("win", n > 0 && counts[i] === max && !cur.activa);
  });
}

/* ---------- projection ---------- */
const projLbl = $("#projBtn span");
$("#projBtn").onclick = () => {
  const on = document.body.classList.toggle("proj");
  projLbl.textContent = on ? "Salir de la proyección" : "Proyectar";
  if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if(!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement && document.body.classList.contains("proj")){ document.body.classList.remove("proj"); projLbl.textContent = "Proyectar"; } });

/* ---------- firebase or demo ---------- */
function listen(){
  if(unsub) unsub();
  const u1 = F.onSnapshot(F.collection(fb.db, "encuestas", cur.id, "votos"), s => { votes = s.docs.map(d => d.data().opcion); render(); }, e => console.error(e));
  const u2 = F.onSnapshot(F.doc(fb.db, "encuestas", cur.id), s => { if(s.exists()){ const d = s.data(); cur.activa = !!d.activa; cur.ocultar = !!d.ocultar; paintState(); render(); } });
  unsub = () => { u1(); u2(); };
}
function simulate(){
  clearTimeout(timer);
  const w = cur.opciones.map((_, i) => [3, 5, 2, 4, 1, 1][i] || 1), sum = w.reduce((a, b) => a + b, 0);
  const tick = () => {
    if(!cur || !cur.activa || votes.length >= 34) return;
    let r = Math.random() * sum, k = 0; while(r > w[k]){ r -= w[k]; k++; }
    votes.push(k); render(); timer = setTimeout(tick, 250 + Math.random() * 700);
  };
  timer = setTimeout(tick, 600);
}
async function connect(){
  try{ fb = await import("./firebase.js"); }catch(e){ fb = null; }
  if(!fb || !fb.configurado){ demo = true; $("#demoPill1").hidden = false; $("#demoPill2").hidden = false; $("#setupMsg").textContent = "En modo de ejemplo, al lanzar la encuesta van llegando votos simulados."; return; }
  try{
    F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const { onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    onAuthStateChanged(fb.auth, async u => {
      if(!u){ $("#setupMsg").innerHTML = 'Para lanzar una encuesta, <a href="docente.html">ingresá al área docente</a>.'; $("#launch").disabled = true; return; }
      $("#launch").disabled = false; $("#setupMsg").textContent = "";
      try{
        const d = await F.getDoc(F.doc(fb.db, "publico", "dinamica"));
        if(d.exists() && d.data().tipo === "encuesta" && d.data().activa){
          const e = await F.getDoc(F.doc(fb.db, "encuestas", d.data().id));
          if(e.exists()){ const x = e.data(); cur = { id: e.id, pregunta: x.pregunta, opciones: x.opciones, ocultar: !!x.ocultar, activa: !!x.activa }; openLive(); listen(); }
        }
      }catch(e){ console.error(e); }
    });
  }catch(e){ console.error(e); demo = true; }
}
drawOpts();
connect();
</script>
