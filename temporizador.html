<style>

:root{
  --bg:#F7F5FB; --paper:#FFFFFF; --ink:#1E2550; --ink2:#2E3566; --muted:#5A5F78; --line:#E2DEEE; --soft:#EEEAF8; --field:#CFC9E3;
  --primary:#1E2550; --primary-ink:#FFFFFF; --live:#D6489A; --live-ink:#A8286E; --ok:#1E7A55; --ok-bg:#E2F3EA;
  --hero-veil:transparent; --nav-bg:rgba(255,255,255,.8);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}}
:root[data-theme="dark"]{
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.serif{font-family:Cambria,Caladea,Georgia,serif}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.hide{display:none!important}

/* header */
.hero{background:linear-gradient(var(--hero-veil),var(--hero-veil)),#E9B5D0 url(img/fondo-intenso.jpg?v=2) center/cover no-repeat}
.hero .in{max-width:1180px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:52px;height:52px}
.brand span{font-weight:700;background:var(--nav-bg);border-radius:8px;padding:4px 10px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--nav-bg);border-radius:12px;padding:4px}
nav a{padding:8px 14px;border-radius:9px;text-decoration:none}
nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.back{font-size:16px;text-decoration:none;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}
h1{margin:4px 0 0;font-size:clamp(32px,5vw,42px);line-height:1.05}


.wrap{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.side{display:flex;flex-direction:column;gap:16px}
.label{display:block;font-weight:700;font-size:16px;margin:0 0 8px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:1px solid var(--field);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:10px 12px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.presets button{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:10px;padding:10px 0;cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.custom{display:flex;align-items:center;gap:8px;margin-top:12px}
.custom input{width:72px;text-align:center;font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:6px}
.custom span{color:var(--muted)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.opt + .opt{border-top:1px solid var(--line)}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--primary);flex:none}
.opt span{color:var(--muted);font-size:15px}
.opt b{display:block;color:var(--ink);font-size:16px}
.demo-pill{display:inline-flex;font-size:14px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:20px;padding:4px 12px}
.note{margin:0;color:var(--muted);font-size:15px}

.stage{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:560px;color:#1E2550}
.stagebar{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-family:Cambria,Caladea,Georgia,serif;font-size:clamp(22px,2.6vw,30px);font-weight:700;min-height:1.2em}
.ring{position:relative;width:min(100%,440px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:#EEEAF8;stroke-width:14}
.ring .bar{fill:none;stroke:#D6489A;stroke-width:14;stroke-linecap:round;transition:stroke .3s}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time b{font-family:Cambria,Caladea,Georgia,serif;font-size:clamp(64px,10vw,112px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ring .time span{font-size:18px;color:#5A5F78;margin-top:6px}
.stage.warn .bar{stroke:#C98A12}
.stage.done .bar{stroke:#B3413A}
.stage.done .time b{color:#B3413A}
@media (prefers-reduced-motion:no-preference){.stage.done .ring{animation:pulse 1s ease-in-out 3}}
@keyframes pulse{50%{transform:scale(1.04)}}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.controls .btn{font-size:18px;padding:12px 22px;min-width:130px}
.stage .btn{background:#FFFFFF;color:#1E2550;border-color:#CFC9E3}
.stage .btn.primary{background:#1E2550;color:#FFFFFF;border-color:#1E2550}

body.proj{background:#FFFFFF}
body.proj header.hero, body.proj .side{display:none}
body.proj .wrap{grid-template-columns:minmax(0,1fr);max-width:none;padding:20px 28px;min-height:100vh}
body.proj .stage{border:0;min-height:calc(100vh - 40px);justify-content:center}
body.proj .ring{width:min(78vh,92vw)}
body.proj .ring .time b{font-size:min(22vh,24vw)}
body.proj .tag{font-size:clamp(30px,4vw,52px)}
</style>
</head>

</div></header>

<div class="wrap">
  <aside class="side">
    <section class="panel">
      <label class="label" for="tag">Para qué es</label>
      <input type="text" id="tag" maxlength="60" placeholder="Por ejemplo: trabajo en grupos">
    </section>
    <section class="panel">
      <span class="label">Duración</span>
      <div class="presets" role="group" aria-label="Duraciones rápidas">
        <button type="button" data-m="1">1 min</button><button type="button" data-m="3">3 min</button><button type="button" data-m="5" aria-pressed="true">5 min</button>
        <button type="button" data-m="10">10 min</button><button type="button" data-m="15">15 min</button><button type="button" data-m="20">20 min</button>
      </div>
      <div class="custom"><input id="mm" type="number" min="0" max="120" value="5" aria-label="Minutos"><span>min</span><input id="ss" type="number" min="0" max="59" value="0" aria-label="Segundos"><span>seg</span></div>
    </section>
    <section class="panel">
      <label class="opt"><input type="checkbox" id="optSound" checked><span><b>Sonido al terminar</b>Tres pitidos cortos cuando llega a cero.</span></label>
    </section>
  </aside>

  <section class="stage" id="stage" aria-live="polite">
    <div class="stagebar"><span class="tag" id="tagOut"></span>
      <div class="controls" style="gap:8px"><button class="btn" id="projBtn" type="button" style="min-width:0;font-size:16px;padding:9px 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Proyectar</span></button></div></div>
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="88"/><circle class="bar" id="bar" cx="100" cy="100" r="88" stroke-dasharray="552.92" stroke-dashoffset="0"/></svg>
      <div class="time"><b id="time" role="timer">05:00</b><span id="sub">Listo para empezar</span></div>
    </div>
    <div class="controls">
      <button class="btn primary" id="start" type="button">Iniciar</button>
      <button class="btn" id="plus" type="button">+1 min</button>
      <button class="btn" id="reset" type="button">Reiniciar</button>
    </div>
  </section>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const C = 2 * Math.PI * 88;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
let total = 5 * 60000, remaining = total, endAt = 0, running = false, finished = false, tickId = 0;

const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
function readDuration(){ const m = Math.max(0, Math.min(120, parseInt($("#mm").value) || 0)), s = Math.max(0, Math.min(59, parseInt($("#ss").value) || 0)); return (m * 60 + s) * 1000; }
function paint(){
  const left = running ? endAt - Date.now() : remaining;
  $("#time").textContent = fmt(left);
  const frac = total ? Math.max(0, Math.min(1, left / total)) : 0;
  $("#bar").style.strokeDashoffset = String(C * (1 - frac));
  const st = $("#stage");
  st.classList.toggle("warn", !finished && left <= 10000 && left > 0 && (running || remaining < total));
  st.classList.toggle("done", finished);
  $("#sub").textContent = finished ? "¡Tiempo!" : running ? "En curso" : remaining < total ? "En pausa" : "Listo para empezar";
  $("#start").textContent = running ? "Pausar" : remaining < total && !finished ? "Reanudar" : "Iniciar";
  $("#tagOut").textContent = $("#tag").value.trim();
  document.title = running ? fmt(left) + " · Temporizador" : "Temporizador";
  if(running && left <= 0) finish();
}
function loop(){ paint(); if(running) tickId = setTimeout(loop, 200); }
function setDuration(ms){
  if(running) return;
  total = remaining = ms; finished = false; paint();
}
function start(){
  if(running){ remaining = Math.max(0, endAt - Date.now()); running = false; clearTimeout(tickId); paint(); return; }
  if(finished || remaining <= 0){ total = remaining = readDuration(); finished = false; }
  if(remaining <= 0) return;
  unlockAudio();
  endAt = Date.now() + remaining; running = true; loop();
}
function addMinute(){
  if(finished){ finished = false; remaining = 60000; total = 60000; }
  else if(running){ endAt += 60000; total += 60000; }
  else { remaining += 60000; total = Math.max(total, remaining); }
  paint();
}
function reset(){ running = false; clearTimeout(tickId); total = remaining = readDuration(); finished = false; paint(); }
function finish(){ running = false; finished = true; remaining = 0; clearTimeout(tickId); paint(); if($("#optSound").checked) beep(); }

/* sound */
let actx = null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === "suspended") actx.resume(); }catch(e){} }
function beep(){
  if(!actx) return;
  [0, .35, .7].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
    const s = actx.currentTime + t; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s + .02); g.gain.exponentialRampToValueAtTime(0.0001, s + .25); o.start(s); o.stop(s + .26); });
}

/* events */
document.querySelectorAll(".presets button").forEach(b => b.onclick = () => {
  if(running) return;
  document.querySelectorAll(".presets button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("#mm").value = b.dataset.m; $("#ss").value = 0; setDuration(readDuration()); store.set("reloj_m", b.dataset.m);
});
["#mm", "#ss"].forEach(s => $(s).addEventListener("input", () => { document.querySelectorAll(".presets button").forEach(x => x.setAttribute("aria-pressed", "false")); setDuration(readDuration()); }));
$("#tag").addEventListener("input", () => { paint(); });
$("#start").onclick = start;
$("#plus").onclick = addMinute;
$("#reset").onclick = reset;
document.addEventListener("keydown", e => { if(e.code === "Space" && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){ e.preventDefault(); start(); } });
const projLbl = $("#projBtn span");
$("#projBtn").onclick = () => {
  const on = document.body.classList.toggle("proj");
  projLbl.textContent = on ? "Salir de la proyección" : "Proyectar";
  if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if(!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement && document.body.classList.contains("proj")){ document.body.classList.remove("proj"); projLbl.textContent = "Proyectar"; } });

const savedM = store.get("reloj_m");
if(savedM){ const b = document.querySelector(`.presets button[data-m="${savedM}"]`); if(b) b.click(); }
setDuration(readDuration());
</script>
