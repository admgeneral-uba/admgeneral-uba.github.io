<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Presentación · Administración General</title>
<link rel="icon" href="img/uba.png">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#esc{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#esc img{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.zona{position:fixed;top:0;bottom:0;width:35%;cursor:pointer;z-index:2}
#atras{left:0;cursor:w-resize}#adelante{right:0;cursor:e-resize}
#barra{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(20,22,40,.82);padding:8px 12px;border-radius:12px;z-index:3;opacity:0;transition:opacity .25s;font-size:15px}
body:hover #barra,#barra:focus-within,body.ver #barra{opacity:1}
#barra button{font:inherit;font-weight:700;background:#fff;color:#1F2340;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
#barra .n{min-width:70px;text-align:center}
#barra .vivo{display:inline-flex;align-items:center;gap:6px;color:#9FE3B4;font-weight:700}
#barra .vivo i{width:9px;height:9px;border-radius:50%;background:#43C46B}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px}
</style>
</head>
<body class="ver">
<div id="msg">Cargando la presentación…</div>
<div id="esc" hidden><img id="img" alt=""></div>
<div class="zona" id="atras" title="Anterior"></div><div class="zona" id="adelante" title="Siguiente"></div>
<div id="barra" hidden>
  <button id="ant" type="button" aria-label="Diapositiva anterior">←</button><span class="n" id="num"></span><button id="sig" type="button" aria-label="Diapositiva siguiente">→</button>
  <button id="pc" type="button">Pantalla completa</button>
  <span class="vivo" id="vivo"><i></i>Compartiendo</span>
  <button id="comp" type="button">Dejar de compartir</button>
</div>
<script type="module">
import { db, auth } from "./firebase.js";
import * as F from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $ = s => document.querySelector(s), nn = n => String(n).padStart(2, "0");
const msg = t => { $("#msg").hidden = !t; $("#msg").textContent = t || ""; };
const cid = new URLSearchParams(location.search).get("c");
onAuthStateChanged(auth, async user => {
  if(!user){ msg("Ingresá como docente en el sitio y volvé a abrir la presentación."); return; }
  try{
    const c = await F.getDoc(F.doc(db, "clases", cid)); if(!c.exists() || !c.data().deck){ msg("Esta clase no tiene una presentación asignada."); return; }
    const clase = { id: cid, ...c.data() }, deck = clase.deck;
    const p = await F.getDoc(F.doc(db, "presentaciones", deck)); const total = p.exists() ? p.data().n : 0;
    if(!total){ msg("No se encontró la presentación."); return; }
    document.title = `Clase ${clase.n} · Presentación`;
    const imgs = {};
    const traer = async n => { if(imgs[n]) return imgs[n]; const d = await F.getDoc(F.doc(db, "diapositivas", deck + "_" + nn(n))); imgs[n] = d.exists() ? d.data().img : ""; return imgs[n]; };
    let n = 1, compartir = true;
    const publicar = () => compartir && F.setDoc(F.doc(db, "publico", "presentacion"), { activa: true, clase: cid, n: clase.n, deck, slide: n, desde: F.serverTimestamp() }).catch(e => console.error(e));
    const mostrar = async () => {
      $("#img").src = await traer(n); $("#esc").hidden = false; $("#barra").hidden = false; msg("");
      $("#num").textContent = `${n} / ${total}`; publicar();
      for(const k of [n + 1, n + 2]) if(k <= total) traer(k).then(src => { const i = new Image(); i.src = src; });
    };
    const ir = d => { const m = Math.min(total, Math.max(1, n + d)); if(m !== n){ n = m; mostrar(); } };
    $("#atras").onclick = $("#ant").onclick = () => ir(-1);
    $("#adelante").onclick = $("#sig").onclick = () => ir(1);
    document.addEventListener("keydown", e => {
      if(["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)){ e.preventDefault(); ir(1); }
      else if(["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)){ e.preventDefault(); ir(-1); }
      else if(e.key === "Home"){ n = 1; mostrar(); } else if(e.key === "End"){ n = total; mostrar(); }
      else if(e.key.toLowerCase() === "f") pantalla();
    });
    const pantalla = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
    $("#pc").onclick = pantalla;
    $("#comp").onclick = async () => {
      compartir = !compartir;
      $("#vivo").hidden = !compartir; $("#comp").textContent = compartir ? "Dejar de compartir" : "Compartir con los estudiantes";
      if(compartir) publicar(); else await F.setDoc(F.doc(db, "publico", "presentacion"), { activa: false }, { merge: true });
    };
    setTimeout(() => document.body.classList.remove("ver"), 2500);
    mostrar();
  }catch(e){ console.error(e); msg("No se pudo abrir la presentación. Revisá que hayas ingresado con tu cuenta docente."); }
});
</script>
</body>
</html>
