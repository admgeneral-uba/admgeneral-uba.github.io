<style>

:root{
  --bg:#F7F5FB; --paper:#FFFFFF; --ink:#1E2550; --ink2:#2E3566; --muted:#5A5F78; --line:#E2DEEE; --soft:#EEEAF8; --field:#CFC9E3;
  --primary:#1E2550; --primary-ink:#FFFFFF; --live:#D6489A; --live-ink:#A8286E; --ok:#1E7A55; --ok-bg:#E2F3EA;
  --hero-veil:transparent; --nav-bg:rgba(255,255,255,.8);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}}
:root[data-theme="dark"]{
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.serif{font-family:Cambria,Caladea,Georgia,serif}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.hide{display:none!important}

/* header */
.hero{background:linear-gradient(var(--hero-veil),var(--hero-veil)),#E9B5D0 none center/cover no-repeat}
.hero .in{max-width:1180px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:52px;height:52px}
.brand span{font-weight:700;background:var(--nav-bg);border-radius:8px;padding:4px 10px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--nav-bg);border-radius:12px;padding:4px}
nav a{padding:8px 14px;border-radius:9px;text-decoration:none}
nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.back{font-size:16px;text-decoration:none;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}

.wrap{max-width:640px;margin:0 auto;padding:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}
.panel.live{border:2px solid var(--live)}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--live-ink)}
.kick::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--live)}
h2{margin:8px 0 16px;font-size:26px;line-height:1.2}
.field{display:flex;flex-direction:column;gap:10px}
.field textarea{font:inherit;font-size:19px;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:12px 14px;min-height:130px;resize:vertical}
.count{font-size:15px;color:var(--muted);text-align:right;margin:-4px 0 0}
.field input{font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:12px 14px}
.btn{width:100%;margin-top:16px;font:inherit;font-size:19px;font-weight:700;border-radius:12px;padding:14px;border:0;background:var(--primary);color:var(--primary-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:wait}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:19px;font-weight:700;color:#fff;border:0;border-radius:12px;padding:16px;cursor:pointer;min-height:64px}
.opt .ltr{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.opt:disabled{cursor:default}
.opt.dim{opacity:.35}
.verdict{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;margin:6px 0}
.verdict.ok{color:#1E7A55}.verdict.no{color:#B3413A}
.score{display:flex;gap:12px;margin-top:14px}
.score div{flex:1;background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.score b{display:block;font-family:Cambria,Caladea,Georgia,serif;font-size:30px}
.qcount{font-size:15px;font-weight:700;color:var(--muted)}
.err{color:#B3413A;min-height:1.4em;margin:10px 0 0}
.muted{color:var(--muted)}
</style>

<div style="margin-top:18px;text-align:center"><a href="index.html" style="display:inline-block;font:inherit;font-weight:700;text-decoration:none;color:#1E2550;background:#fff;border:1px solid #CFC9E3;border-radius:10px;padding:12px 22px">Volver al inicio</a></div></div>
<script type="module">
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
let disp = store.get("disp"); if(!disp){ disp = Math.random().toString(36).slice(2, 12); store.set("disp", disp); }
let fb, F;
function encuesta(d){
  const k = "enc_" + d.id, mine = store.get(k);
  const COLE = ["#C2307E", "#1F6FB8", "#6A4FC4", "#1E2550", "#1A7FA8", "#A8286E"];
  if(mine !== null){ app.innerHTML = `<div class="panel"><span class="kick">Encuesta</span><h2 class="serif">¡Gracias por votar!</h2><p class="muted" style="margin:0">Elegiste <b>${esc(d.opciones[+mine] || "")}</b>. Mirá la pantalla del aula para ver los resultados.</p></div>`; return; }
  app.innerHTML = `<div class="panel live"><span class="kick">Encuesta</span><h2 class="serif">${esc(d.pregunta)}</h2>
    <div class="opts">${d.opciones.map((o, j) => `<button class="opt" type="button" data-j="${j}" style="background:${COLE[j]}"><span class="ltr">${"ABCDEF"[j]}</span>${esc(o)}</button>`).join("")}</div><p class="err" id="err" role="alert"></p></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = async () => {
    const j = +b.dataset.j; app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x !== b) x.classList.add("dim"); });
    try{ await F.setDoc(F.doc(fb.db, "encuestas", d.id, "votos", disp), { opcion: j, hora: F.serverTimestamp() }); store.set(k, String(j)); encuesta(d); }
    catch(e){ console.error(e); if(e.code === "permission-denied"){ store.set(k, String(j)); document.getElementById("err").textContent = "La votación ya está cerrada o ya habías votado."; } else { document.getElementById("err").textContent = "No se pudo enviar. Probá de nuevo."; app.querySelectorAll(".opt").forEach(x => { x.disabled = false; x.classList.remove("dim"); }); } }
  });
}

const OPTC = [{ c: "#C2307E", l: "A" }, { c: "#1F6FB8", l: "B" }, { c: "#6A4FC4", l: "C" }, { c: "#1E2550", l: "D" }];
function quiz(d){
  const kA = "quiz_apodo_" + d.id, apodo = store.get(kA);
  const head = `<span class="kick">Quiz · ${esc(d.titulo || "")}</span>`;
  const mine = d.puntajes && d.puntajes[disp];
  const scoreBox = () => mine ? `<div class="score"><div><b>${mine.puntos}</b>puntos</div><div><b>${mine.pos}.°</b>puesto</div></div>` : "";
  if(!apodo){
    if(d.estado === "fin"){ idle(); return; }
    app.innerHTML = `<div class="panel live">${head}<h2 class="serif">Elegí tu apodo para jugar</h2>
      <form id="f" novalidate><div class="field"><input id="ap" maxlength="20" autocomplete="nickname" aria-label="Tu apodo" placeholder="Tu apodo" value="${esc(store.get("quiz_ultimo_apodo") || "")}"></div>
      <button class="btn serif" id="send">Entrar</button><p class="err" id="err" role="alert"></p></form></div>`;
    document.getElementById("f").onsubmit = async ev => {
      ev.preventDefault();
      const v = document.getElementById("ap").value.trim().replace(/\s+/g, " "), err = document.getElementById("err");
      if(!v){ err.textContent = "Escribí un apodo."; return; }
      const btn = document.getElementById("send"); btn.disabled = true;
      try{ await F.setDoc(F.doc(fb.db, "partidas", d.id, "jugadores", disp), { apodo: v, hora: F.serverTimestamp() }); store.set(kA, v); store.set("quiz_ultimo_apodo", v); quiz(d); }
      catch(e){ console.error(e); btn.disabled = false; err.textContent = "No se pudo entrar. Probá de nuevo."; }
    };
    return;
  }
  if(d.estado === "lobby"){ app.innerHTML = `<div class="panel">${head}<h2 class="serif">¡Ya estás, ${esc(apodo)}!</h2><p class="muted" style="margin:0">Esperá a que empiece el quiz.</p></div>`; return; }
  const kR = "quiz_resp_" + d.id + "_" + d.idx, myAns = store.get(kR);
  if(d.estado === "pregunta"){
    if(myAns !== null){ app.innerHTML = `<div class="panel">${head}<p class="qcount" style="margin-top:8px">Pregunta ${d.idx + 1} de ${d.total}</p><h2 class="serif">Respuesta enviada</h2><p class="muted" style="margin:0">Mirá la pantalla del aula para ver el resultado.</p></div>`; return; }
    app.innerHTML = `<div class="panel live">${head}<p class="qcount" style="margin-top:8px">Pregunta ${d.idx + 1} de ${d.total}</p><h2 class="serif">${esc(d.pregunta)}</h2>
      <div class="opts">${d.opciones.map((o, j) => o ? `<button class="opt" type="button" data-j="${j}" style="background:${OPTC[j].c}"><span class="ltr">${OPTC[j].l}</span>${esc(o)}</button>` : "").join("")}</div><p class="err" id="err" role="alert"></p></div>`;
    app.querySelectorAll(".opt").forEach(b => b.onclick = async () => {
      const j = +b.dataset.j; app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x !== b) x.classList.add("dim"); });
      try{ await F.setDoc(F.doc(fb.db, "partidas", d.id, "respuestas", disp + "_" + d.idx), { disp, idx: d.idx, opcion: j, hora: F.serverTimestamp() }); store.set(kR, String(j)); quiz(d); }
      catch(e){ console.error(e); document.getElementById("err").textContent = e.code === "permission-denied" ? "Se terminó el tiempo para esta pregunta." : "No se pudo enviar. Probá de nuevo."; app.querySelectorAll(".opt").forEach(x => { x.disabled = false; x.classList.remove("dim"); }); }
    });
    return;
  }
  if(d.estado === "resultado"){
    const ok = myAns !== null && +myAns === d.correcta;
    app.innerHTML = `<div class="panel">${head}<p class="qcount" style="margin-top:8px">Pregunta ${d.idx + 1} de ${d.total}</p>
      <p class="verdict ${ok ? "ok" : "no"}">${myAns === null ? "Sin respuesta" : ok ? "¡Correcto!" : "Incorrecto"}</p>
      <p class="muted" style="margin:0">La respuesta correcta era <b>${esc(d.opciones[d.correcta])}</b>.</p>${scoreBox()}</div>`;
    return;
  }
  if(d.estado === "fin"){
    app.innerHTML = `<div class="panel">${head}<h2 class="serif">¡Terminó el quiz!</h2>${mine ? `<p class="muted" style="margin:0">Así te fue, ${esc(apodo)}:</p>${scoreBox()}` : ""}
      ${d.top && d.top.length ? `<p style="margin:18px 0 6px;font-weight:700">Podio</p>${d.top.slice(0, 3).map((t, i) => `<p style="margin:0 0 4px">${i + 1}. ${esc(t.apodo)} · ${t.puntos} puntos</p>`).join("")}` : ""}</div>`;
  }
}


const idle = () => app.innerHTML = `<div class="panel"><h2 class="serif" style="margin-top:0">No hay ninguna dinámica abierta</h2><p class="muted" style="margin:0">Cuando el docente lance una, aparece acá sola. No hace falta recargar.</p></div>`;
function nube(d){
  if(store.get("nube_" + d.id)){
    app.innerHTML = `<div class="panel"><span class="kick">Nube de palabras</span><h2 class="serif">¡Listo! Ya estás en la nube.</h2><p class="muted" style="margin:0">Mirá la pantalla del aula para ver cómo va quedando.</p></div>`; return;
  }
  const n = Math.min(3, Math.max(1, d.max || 1));
  app.innerHTML = `<div class="panel live"><span class="kick">Nube de palabras</span><h2 class="serif">${esc(d.pregunta)}</h2>
    <form id="f" novalidate><div class="field">${Array.from({ length: n }, (_, i) => `<input maxlength="25" autocomplete="off" aria-label="Palabra ${i + 1}" placeholder="${i === 0 ? "Tu palabra" : "Otra palabra (opcional)"}">`).join("")}</div>
    <button class="btn serif" id="send">Enviar</button><p class="err" id="err" role="alert"></p></form></div>`;
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const words = [...app.querySelectorAll("input")].map(i => i.value.trim().replace(/\s+/g, " ")).filter(Boolean);
    const err = document.getElementById("err");
    if(!words.length){ err.textContent = "Escribí al menos una palabra."; return; }
    const btn = document.getElementById("send"); btn.disabled = true; err.textContent = "";
    try{
      for(const w of words) await F.addDoc(F.collection(fb.db, "nubes", d.id, "palabras"), { texto: w, disp, hora: F.serverTimestamp() });
      store.set("nube_" + d.id, "1"); nube(d);
    }catch(e){ console.error(e); btn.disabled = false; err.textContent = e.code === "permission-denied" ? "La nube ya no recibe respuestas." : "No se pudo enviar. Revisá tu conexión e intentá de nuevo."; }
  };
}
function mural(d){
  const key = "mural_" + d.id, sent = +(store.get(key) || 0), MAX = 3;
  if(sent >= MAX){ app.innerHTML = `<div class="panel"><span class="kick">Mural de ideas</span><h2 class="serif">¡Gracias por tus ideas!</h2><p class="muted" style="margin:0">Ya enviaste ${MAX}. Mirá la pantalla del aula para ver el mural.</p></div>`; return; }
  const form = () => {
    app.innerHTML = `<div class="panel live"><span class="kick">Mural de ideas</span><h2 class="serif">${esc(d.pregunta)}</h2>
      <form id="f" novalidate><div class="field">
      ${d.nombre ? `<input id="nom" maxlength="40" autocomplete="given-name" aria-label="Tu nombre" placeholder="Tu nombre" value="${esc(store.get("mural_nombre") || "")}">` : ""}
      <textarea id="txt" maxlength="200" aria-label="Tu idea" placeholder="Escribí tu idea"></textarea><p class="count" id="cnt">0 / 200</p></div>
      <button class="btn serif" id="send">Enviar idea</button><p class="err" id="err" role="alert"></p></form></div>`;
    const txt = document.getElementById("txt");
    txt.oninput = () => document.getElementById("cnt").textContent = `${txt.value.length} / 200`;
    document.getElementById("f").onsubmit = async ev => {
      ev.preventDefault();
      const err = document.getElementById("err"), texto = txt.value.trim().replace(/\s+/g, " ");
      const nombre = d.nombre ? (document.getElementById("nom").value.trim()) : "";
      if(texto.length < 2){ err.textContent = "Escribí tu idea antes de enviarla."; return; }
      if(d.nombre && !nombre){ err.textContent = "Escribí tu nombre."; return; }
      const btn = document.getElementById("send"); btn.disabled = true; err.textContent = "";
      try{
        await F.addDoc(F.collection(fb.db, "murales", d.id, "notas"), { texto, nombre, disp, hora: F.serverTimestamp() });
        if(d.nombre) store.set("mural_nombre", nombre);
        const n = +(store.get(key) || 0) + 1; store.set(key, String(n));
        app.innerHTML = `<div class="panel"><span class="kick">Mural de ideas</span><h2 class="serif">¡Listo! Tu idea ya llegó.</h2><p class="muted" style="margin:0 0 4px">${d.moderar === false ? "Mirá la pantalla del aula." : "Aparece en el mural cuando el docente la apruebe."}</p>${n < MAX ? '<button class="btn serif" id="more">Enviar otra idea</button>' : ""}</div>`;
        const more = document.getElementById("more"); if(more) more.onclick = form;
      }catch(e){ console.error(e); btn.disabled = false; err.textContent = e.code === "permission-denied" ? "El mural ya no recibe ideas." : "No se pudo enviar. Revisá tu conexión e intentá de nuevo."; }
    };
  };
  form();
}
try{
  fb = await import("./firebase.js");
  if(!fb.configurado) throw new Error("sin configurar");
  F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  let currentKey = "";
  F.onSnapshot(F.doc(fb.db, "publico", "dinamica"), s => {
    const d = s.exists() ? s.data() : null;
    const key = d ? [d.tipo, d.id, d.activa, d.estado, d.idx].join("|") : "";
    if(key === currentKey) return; currentKey = key;
    if(d && d.activa && d.tipo === "nube") nube(d); else if(d && d.activa && d.tipo === "mural") mural(d); else if(d && d.activa && d.tipo === "quiz") quiz(d); else if(d && d.activa && d.tipo === "encuesta") encuesta(d); else idle();
  }, () => idle());
}catch(e){
  console.error(e);
  app.innerHTML = `<div class="panel"><p class="muted" style="margin:0">No se pudo conectar. Revisá tu conexión y recargá la página.</p></div>`;
}
</script>
</body>
</html>
