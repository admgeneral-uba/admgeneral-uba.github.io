<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración General</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:24px}
.clase h3{margin:4px 0 6px;font-size:26px;line-height:1.2}
.clase ul{margin:10px 0 0;padding-left:20px}
.clase li{margin:3px 0}
.lect{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.lect li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.lect li span{flex:1}
.live{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.live h2{margin:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--live);margin-right:8px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.rec{display:flex;flex-direction:column;gap:12px}
.rec a{font-weight:700}
.avs{display:flex;flex-direction:column}
.av{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line2)}
.av:first-child{border-top:0;padding-top:0}
.av.done>span:first-child{color:var(--muted)}
.rec p{margin:2px 0 0;color:var(--text);font-size:16px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}
.duo .game{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gh{background:#E9B5D0 url(img/fondo-intenso.jpg) center/cover;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.gh b{font-family:var(--serif);font-size:22px;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 10px}
.gh .pill,.gh .muted{background:rgba(255,255,255,.85)}
.gh .muted{border-radius:6px;padding:3px 8px}
.gb{padding:18px 22px 22px}
.gb .q{margin:0 0 12px;font-size:18px;font-weight:700}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--field);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt span{width:28px;height:28px;flex:none;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok span{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad span{background:var(--bad);color:#fff}
.res{margin:6px 0 0;font-weight:700}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.mini{display:grid;gap:6px;max-width:340px}
.mini span{aspect-ratio:1;border:2px solid var(--line);border-radius:7px}
</style>
</head>
<body>
<script type="module">
import { iniciar, db, F, esc, toast, leerClases, leerUnidades, leerMiDoc, larga, hoyISO, esUrl, botonToggle, ICON, CURSO_INFO, finClase, misDesafios, racha } from "./app.js";

iniciar({ area: "estudiantes", activo: "", titulo: CURSO_INFO.nombre, subtitulo: CURSO_INFO.subtitulo, grande: true }, async (user, main) => {
  const [clases, unidades, mio, avs] = await Promise.all([leerClases(), leerUnidades(), leerMiDoc(user.uid), F.getDocs(F.collection(db, "avisos"))]);
  const hechos = { ...(mio.hechos || {}) };
  const avisos = avs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.orden || 0) - (b.orden || 0));
  const hoy = hoyISO();
  const actual = clases.find(c => c.fecha >= hoy) || clases[clases.length - 1];
  const u = actual && actual.unidad ? unidades[actual.unidad] : null;
  const nombre = (user.displayName || "").split(" ")[0];

  main.innerHTML = `
    <div id="vivo"></div>
    <div class="cols">
      <div class="card clase">
        ${actual ? `<span class="kick">${actual.fecha === hoy ? "Hoy" : "Próxima clase"}</span>
          <h3>Clase ${actual.n}: ${esc(actual.titulo)}</h3>
          <div class="muted">${esc(larga(actual.fecha))} · ${esc(actual.modalidad)}${actual.unidad ? " · Unidad " + actual.unidad : ""}</div>
          ${actual.temas ? `<ul>${actual.temas.split("\n").filter(Boolean).map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
          ${u && u.lecturas && u.lecturas.length ? `<h2 style="margin:22px 0 12px;font-size:20px">Para leer</h2><ul class="lect">${u.lecturas.filter(l => l.tipo !== "Complementaria").map(l => `<li><span>${esc(l.cita)}</span>${esUrl(l.url) ? `<a class="btn small" href="${esc(l.url)}" target="_blank" rel="noopener">Abrir</a>` : ""}</li>`).join("")}</ul>` : ""}`
        : `<h2>¡Hola${nombre ? ", " + esc(nombre) : ""}!</h2><p class="empty">Pronto vas a ver acá el cronograma de las clases.</p>`}
      </div>
      <div class="side">
        ${avisos.length ? `<div class="card"><h2>Consignas, tareas y avisos</h2><div class="avs">${avisos.map(a => `<div class="av${hechos[a.id] ? " done" : ""}"><span>${esUrl(a.url) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titulo)}</a>` : esc(a.titulo)}</span><span data-av="${a.id}">${botonToggle("Hecho", !!hechos[a.id])}</span></div>`).join("")}</div></div>` : ""}
        ${u && u.recomendaciones && u.recomendaciones.length ? `<div class="card"><h2>Recomendaciones</h2><div class="rec">${u.recomendaciones.map(r => `<div>${esUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.titulo)}</a>` : `<b>${esc(r.titulo)}</b>`}${r.descripcion ? `<p>${esc(r.descripcion)}</p>` : ""}</div>`).join("")}</div></div>` : ""}
        <div class="card"><h2>Materiales</h2><div class="row"><a class="btn primary" href="materiales.html">Ver lecturas y presentaciones</a><a class="btn" href="cronograma.html">Cronograma</a></div></div>
      </div>
    </div>
    <div class="duo"><section class="game" id="test" hidden></section><section class="game" id="tt" hidden></section></div>`;
  desafios(user, clases, hoy);

  main.querySelectorAll("[data-av]").forEach(w => w.addEventListener("click", async () => {
    const k = w.dataset.av, b = w.querySelector("button"), on = !hechos[k];
    const pintar = v => { b.setAttribute("aria-pressed", v); b.innerHTML = (v ? ICON.check : ICON.circle) + "Hecho"; w.parentElement.classList.toggle("done", v); };
    hechos[k] = on; pintar(on);
    try{ await F.setDoc(F.doc(db, "estudiantes", user.uid), { hechos: { [k]: on } }, { merge: true }); }
    catch(e){ console.error(e); hechos[k] = !on; pintar(!on); toast("No se pudo guardar."); }
  }));

  // Ahora en clase: asistencia abierta o dinámica activa
  let asis = null, din = null;
  const pintarVivo = () => {
    const items = [];
    if(asis && asis.activa) items.push(`<a class="btn primary" href="asistencia.html">Dar el presente</a>`);
    if(din && din.activa) items.push(`<a class="btn primary" href="participar.html">Participar</a>`);
    document.getElementById("vivo").innerHTML = items.length ? `<div class="card live" style="border:2px solid var(--live)"><h2><span class="dot"></span>Ahora en clase</h2><div class="row">${items.join("")}</div></div>` : "";
  };
  F.onSnapshot(F.doc(db, "publico", "actual"), s => { asis = s.data(); pintarVivo(); }, () => {});
  F.onSnapshot(F.doc(db, "publico", "dinamica"), s => { din = s.data(); pintarVivo(); }, () => {});
});

// ----- Test de lectura y Tercer tiempo -----
async function desafios(user, clases, hoy){
  const mis = await misDesafios(user.uid).catch(() => ({ tests: [], jugadas: [] }));
  // Test de lectura
  let t = null; try{ const d = await F.getDoc(F.doc(db, "tests", hoy)); if(d.exists()) t = d.data(); }catch(e){}
  const box = document.getElementById("test");
  if(t){
    box.hidden = false;
    const previa = mis.tests.find(x => x.tid === hoy);
    const head = () => `<div class="gh"><b>Test de lectura</b>${racha(mis.tests) > 1 ? `<span class="pill ok">Racha: ${racha(mis.tests)} días</span>` : ""}</div>`;
    const pintar = async (elegida, clave) => {
      box.innerHTML = head() + `<div class="gb"><p class="q">${esc(t.pregunta)}</p>${t.opciones.map((o, i) => {
        const cl = clave ? (i === clave.correcta ? "ok" : i === elegida ? "bad" : "") : "";
        return `<button class="opt ${cl}" type="button" data-o="${i}"${elegida !== undefined ? " disabled" : ""}><span>${"ABCD"[i]}</span>${esc(o)}</button>`;
      }).join("")}${clave ? `<p class="res ${elegida === clave.correcta ? "ok" : "bad"}">${elegida === clave.correcta ? "¡Correcto!" : "No es esa."}${clave.explicacion ? " " + esc(clave.explicacion) : ""}</p>` : ""}</div>`;
      box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => responder(+b.dataset.o));
    };
    const verClave = async () => { try{ const k = await F.getDoc(F.doc(db, "claves", hoy)); return k.exists() ? k.data() : null; }catch(e){ return null; } };
    async function responder(o){
      box.querySelectorAll("[data-o]").forEach(b => b.disabled = true);
      try{
        await F.setDoc(F.doc(db, "respuestasTest", hoy + "_" + user.uid), { tid: hoy, uid: user.uid, opcion: o, hora: F.serverTimestamp() });
        mis.tests.push({ tid: hoy, opcion: o }); pintar(o, await verClave());
      }catch(e){ console.error(e); toast("No se pudo guardar la respuesta."); pintar(); }
    }
    if(previa) pintar(previa.opcion, await verClave()); else pintar();
  }
  // Tercer tiempo
  const pasadas = clases.filter(c => finClase(c.fecha).getTime() <= Date.now()).reverse();
  let j = null, jid = null;
  for(const c of pasadas.slice(0, 3)){ try{ const d = await F.getDoc(F.doc(db, "juegos", c.id)); if(d.exists()){ j = d.data(); jid = c.id; break; } }catch(e){} }
  if(j){
    const tt = document.getElementById("tt"); tt.hidden = false;
    const mia = mis.jugadas.find(x => x.juego === jid);
    const L = j.palabra.length;
    const estado = !mia ? "Adiviná la palabra de la clase en 6 intentos." : mia.terminado ? (mia.gano ? `¡La adivinaste en ${mia.intentos.length}!` : "Esta vez no salió.") : `Te quedan ${6 - mia.intentos.length} intentos.`;
    tt.innerHTML = `<div class="gh"><b>Tercer tiempo</b><span class="muted small">Clase ${j.n}</span></div><div class="gb">
      <div class="mini" style="grid-template-columns:repeat(${L},1fr)">${Array.from({ length: L }, () => "<span></span>").join("")}</div>
      <p style="margin:12px 0">${estado}</p><a class="btn ${mia && mia.terminado ? "" : "primary"}" href="tercer-tiempo.html">${!mia ? "Jugar" : mia.terminado ? "Ver resultado" : "Seguir jugando"}</a></div>`;
  }
}
</script>
</body>
</html>
