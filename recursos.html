<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recursos · Área docente</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
a.tool{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;transition:border-color .15s,transform .15s}
a.tool:hover{border-color:var(--ink);transform:translateY(-2px)}
a.tool h2{margin:0;font-size:22px}
a.tool p{margin:0;color:var(--text)}
a.tool .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:6px}
</style>
</head>
<body>
<script type="module">
import { iniciar } from "./app.js";
const svg = d => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const T = [
  ["grupos.html", "Armar grupos", "Grupos al azar con los presentes.", "#1E2550", '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 14c3 0 6 1.5 6 4.5"/>'],
  ["nube.html", "Nube de palabras", "Respuestas cortas que se agrupan en vivo.", "#C2307E", '<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/>'],
  ["mural.html", "Mural de ideas", "Notas de los estudiantes en una pared.", "#1F6FB8", '<rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/>'],
  ["quiz.html", "Quiz con ranking", "Preguntas con tiempo y puntaje.", "#6A4FC4", '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/>'],
  ["encuesta.html", "Encuesta en vivo", "Una pregunta con opciones y resultados.", "#1A7FA8", '<path d="M5 20V10M12 20V4M19 20v-7"/>'],
  ["ruleta.html", "Ruleta de nombres", "Elige al azar entre los presentes.", "#C2307E", '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12L5.6 18.4"/>'],
  ["afirmaciones.html", "Afirmaciones del grupo", "Lo que respondieron en el perfil, sin nombres.", "#1E7A55", '<path d="M4 6h10M4 12h16M4 18h7"/>'],
  ["temporizador.html", "Temporizador", "Cuenta regresiva en pantalla completa.", "#A8286E", '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/>']
];
iniciar({ area: "docente", activo: "Recursos", titulo: "Recursos para la clase", fondo: "intenso" }, async (user, main) => {
  main.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))">${T.map(([h, t, d, c, i]) =>
    `<a class="tool" href="${h}"><span class="ico" style="background:${c}">${svg(i)}</span><h2>${t}</h2><p>${d}</p></a>`).join("")}</div>`;
});
</script>
</body>
</html>
