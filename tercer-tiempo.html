<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tercer tiempo · Administración General</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>.tjcard{max-width:600px;margin:0 auto;width:100%}</style>
</head>
<body>
<script type="module">
import { iniciar, db, F, esc, leerClases, finClase, ahora } from "./app.js";
import { montarJuego } from "./juegos-ui.js";

iniciar({ area: "estudiantes", activo: "", titulo: "Tercer tiempo" }, async (user, main) => {
  const clases = await leerClases(), momento = ahora();
  const pasadas = clases.filter(c => finClase(c.fecha).getTime() <= momento).reverse();
  let juego = null, jid = null;
  for(const c of pasadas.slice(0, 3)){
    try{ const d = await F.getDoc(F.doc(db, "juegos", c.id)); if(d.exists()){ juego = d.data(); jid = c.id; break; } }catch(e){}
  }
  if(!juego){ main.innerHTML = '<div class="card tjcard" style="text-align:center"><h2>Todavía no hay juego</h2><p class="empty">El juego de cada clase se habilita cuando termina la clase.</p><a class="btn" href="index.html">Volver al inicio</a></div>'; return; }
  main.innerHTML = '<div class="card tjcard" id="juego"></div>';
  await montarJuego(document.getElementById("juego"), { juego, jid, user, db, F, esc, titulo: true });
});
</script>
</body>
</html>
