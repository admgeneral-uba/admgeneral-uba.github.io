<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Estudiantes · Área docente</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 260px;width:auto}
.chip{font:inherit;font-size:15px;min-height:40px;padding:8px 14px;border-radius:9px;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--field)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;font-size:14px;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.who{display:flex;gap:10px;align-items:center}
.who img,.who .ini{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--live);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.who small{color:var(--muted);font-size:14px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px}
.nums div{background:var(--soft);border-radius:12px;padding:14px 16px}
.nums b{font-family:var(--serif);font-size:34px;line-height:1;display:block;margin-bottom:4px}
td input.nota{width:62px;padding:6px 8px;text-align:center}
td select.nota{width:auto;padding:6px 8px}
</style>
</head>
<body>
<script type="module">
import { iniciar, db, F, esc, toast, $, leerClases, leerTomadas, corta, descargarCSV, hoyISO, ahora, finClase } from "./app.js";

iniciar({ area: "docente", activo: "Estudiantes", titulo: "Estudiantes", fondo: "intenso" }, async (user, main) => {
  const [clases, tomadas, est, as, ns, rt, jg] = await Promise.all([leerClases(), leerTomadas(), F.getDocs(F.collection(db, "estudiantes")), F.getDocs(F.collection(db, "asistencias")), F.getDocs(F.collection(db, "notas")), F.getDocs(F.collection(db, "respuestasTest")), F.getDocs(F.collection(db, "jugadas"))]);
  const des = {}; rt.docs.forEach(d => des[d.data().uid] = (des[d.data().uid] || 0) + 1); jg.docs.forEach(d => { if(d.data().terminado) des[d.data().uid] = (des[d.data().uid] || 0) + 1; });
  const tom = clases.filter(c => tomadas[c.id]);
  const pres = {}; as.docs.forEach(d => { const r = d.data(); if(r.uid){ (pres[r.uid] = pres[r.uid] || new Set()).add(r.sesion); } });
  const notas = {}; ns.docs.forEach(d => notas[d.id] = d.data());
  const L = est.docs.map(d => {
    const x = d.data(), p = x.perfil || {}, b = p.bloques || {};
    const n = tom.filter(c => pres[d.id] && pres[d.id].has(c.id)).length;
    return { uid: d.id, p, email: x.email || "", nombre: [p.nombre, p.apellido].filter(Boolean).join(" ") || x.nombreGoogle || x.email || "Sin nombre",
      orden: (p.apellido || "") + " " + (p.nombre || x.nombreGoogle || ""), pres: n, pct: tom.length ? Math.round(n / tom.length * 100) : null,
      vistos: Object.values(x.vistos || {}).filter(Boolean).length, des: des[d.id] || 0, completo: ["b1", "b2", "b3", "b5"].every(k => b[k]), nota: notas[d.id] || {} };
  }).sort((a, b) => a.orden.localeCompare(b.orden, "es"));
  const f = { riesgo: false, perfil: false, trabaja: false }; let q = "";

  const pcts = L.map(s => s.pct).filter(x => x !== null);
  const prom = pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null, bajo = pcts.filter(x => x < 75).length;
  const hoy = hoyISO(), rHoy = rt.docs.filter(d => d.data().tid === hoy).length;
  const ult = clases.filter(c => finClase(c.fecha).getTime() <= ahora()).pop();
  const jug = ult ? jg.docs.filter(d => d.data().juego === ult.id).length : 0;
  main.innerHTML = `<section class="card"><h2>El curso en números</h2><div class="nums">
      <div><b>${L.length}</b>Estudiantes</div>
      <div><b>${prom === null ? "—" : prom + " %"}</b>Asistencia promedio</div>
      <div><b>${prom === null ? "—" : bajo}</b>Debajo del 75 %</div>
      <div><b>${rHoy}</b>Test de lectura de hoy</div>
      <div><b>${jug}</b>Jugaron el Tercer tiempo${ult ? " de la clase " + ult.n : ""}</div></div></section>
    <div class="row"><button class="btn" id="dA" type="button">Descargar planilla de asistencia</button><button class="btn" id="dP" type="button">Descargar datos de perfiles</button></div>
    <section class="card"><div class="tools"><input type="text" id="q" placeholder="Buscar por nombre, DNI o email" aria-label="Buscar estudiante">
      <button class="chip" type="button" data-f="riesgo" aria-pressed="false">Debajo del 75 %</button><button class="chip" type="button" data-f="perfil" aria-pressed="false">Perfil incompleto</button><button class="chip" type="button" data-f="trabaja" aria-pressed="false">Trabajan</button></div>
      <div class="tw" id="tabla"></div><p class="muted" id="cnt" style="margin:12px 0 0"></p></section>`;

  const pill = (ok, t) => `<span class="pill ${ok ? "ok" : ok === false ? "bad" : "na"}">${t}</span>`;
  function draw(){
    const R = L.filter(s => (!f.riesgo || (s.pct !== null && s.pct < 75)) && (!f.perfil || !s.completo) && (!f.trabaja || s.p.trabaja === "Sí")
      && (!q || (s.nombre + " " + (s.p.legajo || "") + " " + s.email).toLowerCase().includes(q)));
    $("#tabla").innerHTML = L.length ? `<table><tr><th>Estudiante</th><th>DNI</th><th>Carrera</th><th>Trabaja</th><th>Asistencia</th><th>Desafíos</th><th>Contenidos vistos</th><th>Perfil</th><th>1° parcial</th><th>2° parcial</th><th>TP N° 1</th><th>TP N° 2</th></tr>
      ${R.map(s => `<tr><td><div class="who">${s.p.foto ? `<img src="${s.p.foto}" alt="">` : `<span class="ini">${esc((s.nombre[0] || "?").toUpperCase())}</span>`}<span><b>${esc(s.nombre)}</b>${s.p.apodo ? `<br><small>${esc(s.p.apodo)}</small>` : ""}</span></div></td>
        <td>${esc(s.p.legajo || "—")}</td><td>${esc(s.p.carrera || "—")}</td><td>${esc(s.p.trabaja || "—")}</td>
        <td>${s.pct === null ? "—" : pill(s.pct >= 75 ? true : false, s.pct + " %")}</td><td>${s.des}</td><td>${s.vistos}</td><td>${pill(s.completo ? true : null, s.completo ? "Completo" : "Incompleto")}</td>
        <td><input class="nota" type="text" inputmode="decimal" data-u="${s.uid}" data-k="parcial1" value="${esc(s.nota.parcial1 ?? "")}" aria-label="Nota del 1° parcial de ${esc(s.nombre)}"></td>
        <td><input class="nota" type="text" inputmode="decimal" data-u="${s.uid}" data-k="parcial2" value="${esc(s.nota.parcial2 ?? "")}" aria-label="Nota del 2° parcial de ${esc(s.nombre)}"></td>
        ${["tp1", "tp2"].map((k, j) => `<td><select class="nota tp" data-u="${s.uid}" data-k="${k}" aria-label="TP N° ${j + 1} de ${esc(s.nombre)}">${["", "Aprobado", "Reprobado"].map(o => `<option value="${o}"${(s.nota[k] || "") === o ? " selected" : ""}>${o || "—"}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</table>` : '<p class="empty">Todavía no ingresó ningún estudiante.</p>';
    $("#cnt").textContent = L.length ? `${R.length} de ${L.length} estudiantes` : "";
    $("#tabla").querySelectorAll(".nota").forEach(i => i.onchange = async () => {
      const v = i.value.trim().replace(",", ".");
      if(i.tagName === "INPUT" && v && !(/^\d{1,2}(\.\d{1,2})?$/.test(v) && +v <= 10)){ toast("La nota tiene que ser un número del 0 al 10."); return; }
      const s = L.find(x => x.uid === i.dataset.u);
      try{ s.nota[i.dataset.k] = v; await F.setDoc(F.doc(db, "notas", s.uid), { [i.dataset.k]: v }, { merge: true }); toast("Nota guardada"); }
      catch(e){ console.error(e); toast("No se pudo guardar la nota."); }
    });
  }
  $("#q").oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  main.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { f[b.dataset.f] = !f[b.dataset.f]; b.setAttribute("aria-pressed", f[b.dataset.f]); draw(); });
  $("#dA").onclick = () => descargarCSV("asistencia.csv", [["Apellido", "Nombre", "DNI", "Email", ...tom.map(c => `Clase ${c.n} (${corta(c.fecha)})`), "Presentes", "Asistencia", "Desafíos"],
    ...L.map(s => [s.p.apellido || "", s.p.nombre || s.nombre, s.p.legajo || "", s.email, ...tom.map(c => pres[s.uid] && pres[s.uid].has(c.id) ? "P" : "A"), s.pres, s.pct === null ? "" : s.pct + " %", s.des])]);
  const FR = ["Rol de alta jerarquía", "Ganar dinero", "Impacto social", "Impacto ambiental", "Liderazgo", "Socializar", "Hablar en público"];
  $("#dP").onclick = () => descargarCSV("perfiles.csv", [["Apellido", "Nombre", "Apodo", "DNI", "Email", "Fecha de nacimiento", "Lugar de nacimiento", "Carrera", "Materias aprobadas", "Otras materias", "Por qué estudia", "Trabaja", "Organización", "Cargo", "Antigüedad", ...FR, "Aspiración", "Película o serie", "Hobby", "Música", "Fútbol"],
    ...L.map(({ p, email, nombre }) => [p.apellido || "", p.nombre || nombre, p.apodo || "", p.legajo || "", email, p.nacimiento || "", p.lugar || "", p.carrera || "", p.aprobadas || "", p.otras || "", p.porque || "", p.trabaja || "", p.org || "", p.cargo || "", p.antig || "", ...FR.map((_, i) => (p.likert || {})[i] || ""), p.aspiracion || "", p.pelicula || "", p.hobby || "", p.musica || "", p.futbol || ""])]);
  draw();
});
</script>
</body>
</html>
