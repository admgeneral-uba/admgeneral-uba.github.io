<style>
:root{
  --bg:#F7F5FB; --paper:#FFFFFF; --ink:#1E2550; --ink2:#2E3566; --muted:#5A5F78; --line:#E2DEEE; --soft:#EEEAF8; --field:#CFC9E3;
  --primary:#1E2550; --primary-ink:#FFFFFF; --live:#D6489A; --live-ink:#A8286E; --ok:#1E7A55; --ok-bg:#E2F3EA;
  --hero-veil:transparent; --nav-bg:rgba(255,255,255,.8);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}}
:root[data-theme="dark"]{
  --bg:#171A2B; --paper:#20243A; --ink:#ECEBF7; --ink2:#D6D5EA; --muted:#A9ACC4; --line:#343954; --soft:#2A2F4A; --field:#454B6B;
  --primary:#E7A3C9; --primary-ink:#1A1530; --live:#F08CC4; --live-ink:#F5A8D2; --ok:#6FD3A3; --ok-bg:#1D3A2E;
  --hero-veil:rgba(23,26,43,.72); --nav-bg:rgba(32,36,58,.85);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.serif{font-family:Cambria,Caladea,Georgia,serif}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.hide{display:none!important}

/* header */
.hero{background:linear-gradient(var(--hero-veil),var(--hero-veil)),#E9B5D0 url(img/fondo-intenso.jpg?v=2) center/cover no-repeat}
.hero .in{max-width:1180px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:52px;height:52px}
.brand span{font-weight:700;background:var(--nav-bg);border-radius:8px;padding:4px 10px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--nav-bg);border-radius:12px;padding:4px}
nav a{padding:8px 14px;border-radius:9px;text-decoration:none}
nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.back{font-size:16px;text-decoration:none;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}
h1{margin:4px 0 0;font-size:clamp(32px,5vw,42px);line-height:1.05}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.panel h2{margin:0 0 4px;font-size:22px}
.label{display:block;font-weight:700;font-size:16px;margin:0 0 8px}

/* source card */
.src{border:2px solid var(--live)}
.src .kick{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--live-ink)}
.src .kick::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--live)}
.src.demo{border-color:var(--line)} .src.demo .kick{color:var(--muted)} .src.demo .kick::before{background:var(--muted)}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.big b{font-size:48px;line-height:1}
.src p{margin:6px 0 0;color:var(--muted);font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:1px solid var(--field);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{flex:none}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;color:var(--ink2)}
textarea{width:100%;min-height:220px;margin-top:10px;resize:vertical;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:10px 12px}

/* settings */
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);font-weight:700;box-shadow:0 1px 3px rgba(30,37,80,.15)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:46px;height:46px;border-radius:10px;border:1px solid var(--field);background:var(--paper);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.stepper input{width:84px;text-align:center;font:inherit;font-size:28px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:5px}
.hint{font-size:16px;color:var(--muted);margin:10px 0 0;min-height:1.3em}
.go{width:100%;margin-top:16px;justify-content:center;font-size:20px;padding:14px}

/* stage */
.stage{min-height:420px;display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;min-height:44px}
.status{font-size:18px;font-weight:700;color:var(--ink2)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;padding:4px}
.pool:empty{display:none}
.chip{position:relative;display:inline-flex;align-items:center;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--c,var(--field));border-radius:9px;padding:6px 12px;font-size:17px;box-shadow:0 2px 6px rgba(30,37,80,.08);will-change:transform;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.group header{background:var(--t);padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--c);border-radius:15px 15px 0 0}
.group h3{margin:0;font-size:22px;color:#1E2550}
.group .n{font-size:15px;color:#2E3566;font-weight:700}
.group .list{display:flex;flex-direction:column;gap:6px;padding:12px;min-height:60px}
.group .list .chip{white-space:normal}
.group.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.04)}}
.empty{border:2px dashed var(--field);border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:24px;color:var(--ink);margin-bottom:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-size:16px}

/* projection */
body.proj header.hero, body.proj .side{display:none}
body.proj .wrap{grid-template-columns:minmax(0,1fr);max-width:none;padding:28px 36px}
body.proj .group h3{font-size:30px}
body.proj .chip{font-size:23px}
body.proj .status{font-size:24px}
body.proj .groups{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
</style>
</head>

<script type="module">
const $ = s => document.querySelector(s);
const COLORS = [
  {c:"#D6489A",t:"#FBE3EF"},{c:"#8C6BD6",t:"#ECE5FA"},{c:"#2B8FD9",t:"#E1F0FB"},{c:"#C2307E",t:"#F8DDEA"},
  {c:"#5A62C8",t:"#E5E6F8"},{c:"#1FA2C9",t:"#DDF2F8"},{c:"#B45BC4",t:"#F3E3F6"},{c:"#3D6FD1",t:"#E2EAF9"}
];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const names = $("#names"), num = $("#num");
let mode = "g", running = false, skip = false, last = null;
const DEMO = ["Lucía Fernández","Martín Gómez","Sofía Pérez","Tomás Rodríguez","Valentina López","Joaquín Martínez","Camila Sánchez","Mateo Romero","Martina Díaz","Benjamín Álvarez","Julieta Torres","Facundo Ruiz","Agustina Ramírez","Nicolás Flores","Florencia Acosta","Santiago Benítez","Micaela Medina","Franco Herrera","Abril Suárez","Lautaro Aguirre","Paula Giménez","Ignacio Molina","Milagros Castro","Thiago Ortiz","Delfina Silva","Bautista Núñez","Renata Rojas","Lucas Domínguez"];
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

/* ---------- source: today's attendance ---------- */
function setSource({kick, n, unit, msg, demo=false, login=false}){
  $("#src").classList.toggle("demo", demo);
  $("#srcKick").textContent = kick;
  $("#srcNum").textContent = n ?? "—";
  $("#srcUnit").textContent = unit || "";
  $("#srcMsg").textContent = msg || "";
  $("#login").classList.toggle("hide", !login);
}
function fill(list){ names.value = list.join("\n"); update(); }
const fmtDay = d => d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "numeric" });

let fb = null, fsx = null, user = null;
async function connect(){
  try{ fb = await import("./firebase.js"); }catch(e){ fb = null; }
  if(!fb || !fb.configurado){ demo(); return; }
  try{
    fsx = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const { onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    onAuthStateChanged(fb.auth, u => { user = u; u ? loadToday() : setSource({ kick: "Presentes de hoy", msg: "Ingresá al área docente para cargar automáticamente a los presentes. Mientras tanto, podés escribir la lista a mano.", login: true }); });
  }catch(e){ console.error(e); setSource({ kick: "Presentes de hoy", msg: "No se pudo conectar con el registro. Revisá la conexión o escribí la lista a mano." }); }
}
async function loadToday(){
  if(!fb){ demo(); return; }
  if(!user){ return; }
  setSource({ kick: "Presentes de hoy", msg: "Cargando el registro de asistencia…" });
  const { collection, query, orderBy, limit, where, getDocs } = fsx;
  try{
    const ses = await getDocs(query(collection(fb.db, "sesiones"), orderBy("creada", "desc"), limit(1)));
    if(ses.empty){ setSource({ kick: "Presentes de hoy", n: 0, msg: "Todavía no tomaste asistencia en ninguna clase. Abrila desde el área docente o escribí la lista a mano." }); return; }
    const s = ses.docs[0], data = s.data();
    const when = data.creada && data.creada.toDate ? data.creada.toDate() : new Date();
    const isToday = when.toDateString() === new Date().toDateString();
    const regs = await getDocs(query(collection(fb.db, "asistencias"), where("sesion", "==", s.id)));
    const list = regs.docs.map(d => (d.data().nombre || "").trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, "es"));
    fill(list);
    setSource({
      kick: isToday ? "Presentes de hoy" : "Presentes de la última clase",
      n: list.length, unit: list.length === 1 ? "presente" : "presentes",
      msg: (data.titulo || "Clase") + " · " + fmtDay(when) + (isToday ? (data.activa ? ". La asistencia sigue abierta: si llega alguien más, tocá “Volver a cargar”." : ".") : ". Hoy todavía no abriste la asistencia.")
    });
  }catch(e){
    console.error(e);
    setSource({ kick: "Presentes de hoy", msg: e.code === "permission-denied" ? "Esta cuenta no tiene permiso para ver la asistencia." : "No se pudo leer el registro. Probá de nuevo o escribí la lista a mano." });
  }
}
function demo(){
  fill(DEMO);
  setSource({ kick: "Modo de ejemplo", n: DEMO.length, unit: "presentes", demo: true,
    msg: "Estos nombres son de prueba. En tu sitio, esta lista se carga sola con quienes registraron asistencia hoy." });
}

/* ---------- settings ---------- */
function list(){
  const seen = new Set(), out = [];
  names.value.split(/\n|;|\t/).map(s => s.trim().replace(/\s+/g, " ")).filter(Boolean).forEach(n => { const k = n.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(n); } });
  return out;
}
function groupsCount(n){ const v = Math.max(1, parseInt(num.value) || 1); return mode === "g" ? Math.min(v, n) : Math.ceil(n / v); }
function update(){
  const n = list().length, v = parseInt(num.value) || 0, hint = $("#hint");
  $("#editBox summary").textContent = `Ver y editar la lista (${n})`;
  if(n < 2){ hint.textContent = "Hacen falta al menos dos nombres."; $("#go").disabled = true; }
  else if(v < (mode === "g" ? 2 : 1)){ hint.textContent = mode === "g" ? "Elegí al menos 2 grupos." : "Elegí al menos 1 persona por grupo."; $("#go").disabled = true; }
  else {
    const g = groupsCount(n), base = Math.floor(n / g), extra = n % g;
    hint.textContent = mode === "g" && v > n ? `Hay más grupos que personas: se armarán ${n} grupos de 1.`
      : extra ? `${g} grupos: ${extra} de ${base + 1} y ${g - extra} de ${base} personas.` : `${g} grupos de ${base} personas.`;
    $("#go").disabled = running;
  }
  store.set("grupos_cfg", JSON.stringify({ mode, v: num.value }));
}
function setMode(m){
  mode = m;
  $("#modeG").setAttribute("aria-pressed", m === "g"); $("#modeP").setAttribute("aria-pressed", m === "p");
  $("#numLabel").textContent = m === "g" ? "¿Cuántos grupos?" : "¿Cuántas personas por grupo?";
  num.min = m === "g" ? 2 : 1; update();
}

/* ---------- animation ---------- */
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wait = ms => new Promise(r => setTimeout(r, skip ? 0 : ms));
function flip(els, change, opts = {}){
  const first = new Map(els.map(e => [e, e.getBoundingClientRect()]));
  change();
  if(reduce || skip) return;
  els.forEach(e => {
    const a = first.get(e), b = e.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if(!dx && !dy) return;
    const lift = opts.lift === e;
    e.animate([
      { transform: `translate(${dx}px,${dy}px) scale(${lift ? 1.15 : 1})`, zIndex: lift ? 50 : 5 },
      { transform: lift ? "translate(0,0) scale(1.06)" : "none", offset: lift ? .75 : 1 },
      ...(lift ? [{ transform: "none" }] : [])
    ], { duration: opts.duration || 450, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
}
async function run(){
  const people = list(); if(people.length < 2 || running) return;
  running = true; skip = false; update();
  $("#empty").classList.add("hide");
  ["#again", "#copy"].forEach(s => $(s).classList.add("hide"));
  $("#skip").classList.toggle("hide", reduce);
  const pool = $("#pool"), wrap = $("#groups");
  wrap.innerHTML = ""; pool.innerHTML = "";
  const g = groupsCount(people.length), order = shuffle(people);
  const chips = people.map(n => { const s = document.createElement("span"); s.className = "chip"; s.textContent = n; s.title = n; return s; });
  chips.forEach(c => pool.appendChild(c));
  if(!reduce) chips.forEach((c, i) => c.animate([{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: Math.min(i * 18, 400), fill: "backwards" }));
  $("#status").textContent = "Mezclando…";
  await wait(reduce ? 0 : 500);
  for(let r = 0; r < (reduce ? 0 : 4) && !skip; r++){
    const cur = [...pool.children];
    flip(cur, () => shuffle(cur).forEach(c => pool.appendChild(c)), { duration: 380 });
    await wait(420);
  }
  const cards = [];
  for(let i = 0; i < g; i++){
    const col = COLORS[i % COLORS.length], card = document.createElement("article");
    card.className = "group"; card.style.setProperty("--c", col.c); card.style.setProperty("--t", col.t);
    card.innerHTML = `<header><h3 class="serif">Grupo ${i + 1}</h3><span class="n">0</span></header><div class="list"></div>`;
    wrap.appendChild(card); cards.push(card);
    if(!reduce && !skip) card.animate([{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 350, delay: i * 60, fill: "backwards" });
  }
  await wait(reduce ? 0 : 350 + g * 60);
  $("#status").textContent = "Repartiendo…";
  const byName = new Map(chips.map(c => [c.textContent, c]));
  const step = Math.max(70, Math.min(320, 3200 / people.length));
  const result = cards.map(() => []);
  for(let k = 0; k < order.length; k++){
    const gi = k % g, chip = byName.get(order[k]), card = cards[gi];
    result[gi].push(order[k]);
    chip.style.setProperty("--c", COLORS[gi % COLORS.length].c);
    flip([...pool.children, ...card.querySelectorAll(".chip")], () => card.querySelector(".list").appendChild(chip), { lift: chip, duration: 520 });
    card.querySelector(".n").textContent = result[gi].length;
    await wait(step);
  }
  pool.innerHTML = ""; last = result;
  $("#status").textContent = `${people.length} personas en ${g} grupos`;
  $("#skip").classList.add("hide");
  ["#again", "#copy"].forEach(s => $(s).classList.remove("hide"));
  if(!reduce){ cards.forEach((c, i) => setTimeout(() => { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }, i * 70)); confetti(); }
  running = false; update();
}
function confetti(){
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  const parts = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * dpr, vy: (-Math.random() * 16 - 6) * dpr,
    s: (6 + Math.random() * 7) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: COLORS[Math.floor(Math.random() * COLORS.length)].c }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => { p.vy += .45 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if(t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
async function copy(){
  if(!last) return;
  const txt = last.map((g, i) => `Grupo ${i + 1}\n` + g.map(n => `- ${n}`).join("\n")).join("\n\n");
  try{ await navigator.clipboard.writeText(txt); toast("Grupos copiados"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Grupos copiados"); }catch(_){ toast("No se pudo copiar"); } ta.remove(); }
}

/* ---------- events ---------- */
names.addEventListener("input", update);
num.addEventListener("input", update);
$("#minus").onclick = () => { num.value = Math.max(+num.min, (parseInt(num.value) || 2) - 1); update(); };
$("#plus").onclick = () => { num.value = (parseInt(num.value) || 1) + 1; update(); };
$("#modeG").onclick = () => setMode("g");
$("#modeP").onclick = () => setMode("p");
$("#reload").onclick = () => (fb && fb.configurado ? loadToday() : demo());
$("#go").onclick = run;
$("#again").onclick = run;
$("#skip").onclick = () => { skip = true; $("#skip").classList.add("hide"); };
$("#copy").onclick = copy;
const projBtn = $("#proj span");
$("#proj").onclick = () => {
  const on = document.body.classList.toggle("proj");
  projBtn.textContent = on ? "Salir de la proyección" : "Proyectar";
  if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if(!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement && document.body.classList.contains("proj")){ document.body.classList.remove("proj"); projBtn.textContent = "Proyectar"; } });

try{ const cfg = JSON.parse(store.get("grupos_cfg") || "null"); if(cfg){ num.value = cfg.v || 5; setMode(cfg.mode === "p" ? "p" : "g"); } }catch(e){}
update();
connect();
</script>
