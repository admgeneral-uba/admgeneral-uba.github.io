<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Área docente</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
a.sec{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
a.sec:hover{border-color:var(--ink)}
a.sec h2{margin:0;font-size:22px}
.next h3{margin:4px 0 8px;font-size:24px}
.next ul{margin:0;padding-left:20px}
</style>
</head>
<body>
<script type="module">
import { iniciar, leerClases, larga, hoyISO, esc, CURSO_INFO } from "./app.js";
iniciar({ area: "docente", activo: "", titulo: CURSO_INFO.nombre, subtitulo: CURSO_INFO.subtitulo, fondo: "intenso", grande: true }, async (user, main) => {
  const clases = await leerClases();
  const hoy = hoyISO(), prox = clases.find(c => c.fecha >= hoy);
  main.innerHTML = `
    ${prox ? `<div class="card next"><span class="kick">${prox.fecha === hoy ? "Hoy" : "Próxima clase"}</span>
      <h3>Clase ${prox.n}: ${esc(prox.titulo)}</h3><p class="muted" style="margin:0 0 8px">${esc(larga(prox.fecha))} · ${esc(prox.modalidad)}${prox.unidad ? " · Unidad " + prox.unidad : ""}</p>
      ${prox.temas ? `<ul>${prox.temas.split("\n").filter(Boolean).map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</div>` : ""}
    <div class="grid">
      <a class="sec" href="docente-asistencia.html"><h2>Asistencia</h2><span class="muted">Abrir el código QR</span></a>
      <a class="sec" href="docente-cronograma.html"><h2>Cronograma</h2><span class="muted">Fechas, títulos y temas</span></a>
      <a class="sec" href="docente-contenidos.html"><h2>Contenidos</h2><span class="muted">Lecturas, presentaciones y recomendaciones</span></a>
      <a class="sec" href="recursos.html"><h2>Recursos</h2><span class="muted">Dinámicas para la clase</span></a>
    </div>`;
});
</script>
</body>
</html>
