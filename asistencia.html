<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistencia · Administración General</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
.box{max-width:520px;margin:10px auto;width:100%;text-align:center}
.box h2{font-size:26px}
.cod{font-size:34px;letter-spacing:.3em;text-align:center;max-width:220px;margin:6px auto 0;font-weight:700}
.okmark{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.err{color:var(--bad);min-height:1.5em;margin:10px 0 0}
</style>
</head>
<body>
<script type="module">
import { iniciar, db, F, esc, $, leerMiDoc, nombreDe } from "./app.js";

iniciar({ area: "estudiantes", activo: "", titulo: "Asistencia", fondo: "rosa" }, async (user, main) => {
  const params = new URLSearchParams(location.search);
  const codigoQR = (params.get("c") || "").replace(/\D/g, "").slice(0, 4);
  const pub = await F.getDoc(F.doc(db, "publico", "actual"));
  const info = pub.exists() ? pub.data() : null;
  if(!info || !info.activa){
    main.innerHTML = `<div class="card box"><h2>La asistencia no está abierta</h2><button class="btn" type="button" onclick="location.reload()">Volver a intentar</button></div>`;
    return;
  }
  const sid = info.sesion, aid = sid + "_" + user.uid;
  const listo = () => { main.innerHTML = `<div class="card box"><div class="okmark"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><h2 style="margin:0 0 6px">¡Presente!</h2><p style="margin:0">${esc(info.titulo)}</p><div class="row" style="justify-content:center;margin-top:18px"><a class="btn" href="index.html">Ir al inicio</a></div></div>`; };
  try{ const ya = await F.getDoc(F.doc(db, "asistencias", aid)); if(ya.exists()) return listo(); }catch(e){}

  const mio = await leerMiDoc(user.uid);
  const nombre = nombreDe(mio.perfil, user) || user.email;

  async function registrar(codigo){
    await F.setDoc(F.doc(db, "asistencias", aid), { sesion: sid, uid: user.uid, nombre, email: user.email || "", codigo, hora: F.serverTimestamp() });
  }
  function form(msg){
    main.innerHTML = `<div class="card box"><h2 style="margin:0 0 4px">${esc(info.titulo)}</h2>
      <form id="f" novalidate><label class="l" for="codigo" style="margin-top:14px">Código de la pantalla</label>
      <input id="codigo" class="cod" inputmode="numeric" maxlength="4" autocomplete="off">
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="enviar">Dar el presente</button></div>
      <p class="err" id="err" role="alert">${esc(msg || "")}</p></form></div>`;
    $("#codigo").focus();
    $("#f").onsubmit = async ev => {
      ev.preventDefault();
      const c = $("#codigo").value.replace(/\D/g, "");
      if(c.length !== 4){ $("#err").textContent = "Escribí los 4 números que se ven en la pantalla."; return; }
      $("#enviar").disabled = true; $("#err").textContent = "";
      try{ await registrar(c); listo(); }
      catch(e){ console.error(e); $("#enviar").disabled = false; $("#codigo").value = "";
        $("#err").textContent = e.code === "permission-denied" ? "El código venció. Escribí el que se ve ahora en la pantalla." : "No se pudo conectar. Probá de nuevo."; }
    };
  }
  if(codigoQR.length === 4){
    main.innerHTML = '<p class="muted">Registrando…</p>';
    try{ await registrar(codigoQR); return listo(); }
    catch(e){ console.error(e); return form(e.code === "permission-denied" ? "El código del QR venció. Escribí el que se ve ahora en la pantalla." : ""); }
  }
  form();
});
</script>
</body>
</html>
