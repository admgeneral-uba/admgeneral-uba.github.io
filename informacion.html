<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Información del curso · Administración General</title>
<link rel="icon" href="img/uba.png">
<link rel="stylesheet" href="sitio.css">
<style>
.top2{display:grid;grid-template-columns:minmax(0,35fr) minmax(0,65fr);gap:22px;align-items:stretch}
@media (max-width:860px){.top2{grid-template-columns:1fr}}
.ess{min-width:0;border:2px solid var(--live)}
.ess .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px 20px}
.ess .g>div{display:flex;gap:12px}
.ess .k{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--live);line-height:1.1;min-width:78px;white-space:nowrap}
.ess .g p{margin:0;color:var(--text);font-size:16px}
.esc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.esc div{flex:1 1 80px;border-radius:10px;padding:8px 10px}
.esc b{font-family:var(--serif);font-size:20px;display:block}
.val{min-width:0;border-radius:16px;padding:22px 30px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)),url(img/papiro.jpg?v=2) center/cover #EBD3A4;box-shadow:inset 0 0 40px rgba(120,80,20,.15);display:flex;flex-direction:column;color:#3B2A12}
.val h2{margin:0 0 6px;font-size:24px}
.val .in{margin-top:4px;flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.val .v{display:flex;gap:14px;padding:16px 0}
.val .v+.v{border-top:1px solid rgba(90,60,20,.22)}
.val .n{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--live-ink);min-width:34px;line-height:1.2}
.val h3{margin:0 0 6px;font-size:22px;line-height:1.25;font-family:var(--sans);font-weight:700}
.val p b{color:#3B2A12}
.val .v>span{flex:1;min-width:0}
.val .fila{display:flex;align-items:center;gap:24px}
.val .fila p{flex:1;min-width:0}
.val .fila img{flex:none;height:78px;width:96px;object-fit:contain}
.val .fila img.valor-protagonistas,.val .fila img.valor-lider{height:90px}
@media (max-width:560px){.val .fila img{height:56px;width:64px}.val .fila img.valor-protagonistas,.val .fila img.valor-lider{height:64px}.val .fila{gap:14px}}
.val p{margin:0;color:#4A3818;font-size:17.5px;line-height:1.55}
.val h2,.val h3{color:#3B2A12}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
.doc{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink)}
a.doc:hover{border-color:var(--ink)}
.doc .ic{width:44px;height:52px;flex:none;border-radius:6px;background:var(--soft);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;font-weight:700;color:var(--live-ink)}
.doc .t{flex:1;min-width:0;font-weight:700;font-size:18px}
.doc.off{background:#F6F5F9;color:#6B6F85}
.doc.off .ic{background:#ECEBF1;color:#8A8DA0}
.faq details{border-top:1px solid var(--line2)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:18px;font-weight:700;padding:16px 0}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex:none;transition:transform .2s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq p{margin:-4px 0 16px;color:var(--text)}
</style>
</head>
<body>
<script type="module">
import { iniciar, db, F, esc, esUrl } from "./app.js";

const DOCS = [["normas", "Normas del curso"], ["programa", "Programa de la cátedra"]];
const FAQ = [
  ["¿Cuándo debería leer la bibliografía?", "Antes de cada clase. En el cronograma figura qué lectura corresponde a cada encuentro. Las dinámicas de clase se aprovechan mejor habiendo leído la bibliografía previamente."],
  ["¿Qué pasa si no llego al 75 % de asistencia?", "Quedás en condición de “ausente” en la materia. Esto vale tanto para las clases presenciales como para las virtuales. Si la ausencia está justificada, se deberá presentar el certificado o documento correspondiente."],
  ["¿Cómo se aprueban los trabajos prácticos?", "Son grupales y tienen dos partes: una entrega escrita y una exposición oral (o una presentación a través de un formato audiovisual). Se califican como aprobados o reprobados. Para aprobarlos tenemos en cuenta que se entreguen en fecha, que se relacionen con la bibliografía, el formato, la redacción y la ortografía, la profundidad del análisis y la calidad de las conclusiones. Si hay que recuperarlo, se vuelve a entregar en la fecha indicada y valoramos cuánto se tuvieron en cuenta los comentarios de los docentes."],
  ["¿Puedo realizar un trabajo grupal en forma individual?", "No. Los trabajos que se indican como grupales están diseñados para desarrollar el trabajo en equipo. El curso propone que interactúen entre ustedes, y van a tener tiempo en clase para formar los equipos. Si no se cumple este requisito, el trabajo práctico se entrega en la instancia de recuperatorio."],
  ["¿Puedo usar el recuperatorio para mejorar una nota?", "Sí. El recuperatorio sirve para rendir un parcial desaprobado o uno cuya nota quieras mejorar. Tené en cuenta que su nota reemplaza siempre a la del parcial, aunque sea más baja."],
  ["¿Qué nota necesito para promocionar?", "Con 7 o más promocionás. El promedio se redondea para arriba: si entre los dos parciales sumás 13 puntos, el 6,5 pasa a 7 y promocionás. Con 4 a 6 quedás regular y rendís un examen final. En todos los casos necesitás el 75 % de asistencia y aprobar ambos parciales."],
  ["¿Puedo sumar puntos por mi compromiso con la cursada?", "Además de los parciales, tenemos en cuenta cómo transitaste el curso: la asistencia a clase, la participación en las consignas y los trabajos sobresalientes. Demostrar un rendimiento destacado sostenido durante todo el cuatrimestre puede mejorar un poco tu nota final, o permitirte aprobar en los casos que queden cerca de la promoción (12 puntos entre ambos parciales)."],
  ["¿Qué es la clase de “entrega de reconocimientos”?", "Es la última clase del cuatrimestre. Nos gusta reconocer a quienes se destacaron durante la cursada: entre todos votamos a compañeras y compañeros en distintas categorías, y los ganadores reciben un premio. Es una forma de cerrar la materia celebrando lo que aprendimos juntos."],
  ["¿Cómo me comunico con el docente?", "Podés enviar un correo a <a href=\"mailto:nicolas.alvarez@economicas.uba.ar\">nicolas.alvarez@economicas.uba.ar</a>."]
];
const VALORES = [
  ["I", "Aprendemos en comunidad.", "El aprendizaje es un proceso colectivo: compartimos, escuchamos y <b>construimos juntos</b>. Valoramos la empatía, el compañerismo y la capacidad de generar <b>vínculos de confianza</b>.", "valor-comunidad"],
  ["II", "Asumimos el protagonismo de nuestro aprendizaje.", "<b>Estamos presentes</b>, dejamos las distracciones de lado y aportamos nuestras opiniones. Nos involucramos con la propuesta académica y <b>ejercemos el liderazgo</b> en las dinámicas de clase.", "valor-lider"],
  ["III", "Desarrollamos nuestro criterio profesional.", "<b>Analizamos y cuestionamos</b> los conceptos estudiados, conectándolos con nuestros valores, ideas y experiencias. Mantenemos una mente abierta y reflexiva para ejercitar el <b>pensamiento crítico</b>.", "valor-criterio"]
];
const CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A5F78" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

iniciar({ area: "estudiantes", activo: "Información", titulo: "Información del curso" }, async (user, main) => {
  let docs = {}; try{ const d = await F.getDoc(F.doc(db, "curso", "documentos")); if(d.exists()) docs = d.data(); }catch(e){}
  main.innerHTML = `
  <div class="top2">
    <section class="card ess"><h2 style="margin-bottom:16px">Lo esencial para aprobar</h2>
      <div class="g">
        <div><span class="k">75 %</span><span><b>Asistencia mínima</b><p>En clases (presenciales y virtuales).</p></span></div>
        <div><span class="k">2</span><span><b>Parciales</b><p>Unidades I-IV y V-VIII. Se evalúan conceptos con preguntas de opción múltiple.</p></span></div>
        <div><span class="k">1</span><span><b>Recuperatorio</b><p>Su nota siempre reemplaza a la del parcial.</p></span></div>
        <div><span class="k">2 TPs</span><span><b>Trabajos prácticos grupales</b><p>Entrega escrita y exposición oral.</p></span></div>
      </div>
      <div class="esc"><div style="background:var(--ok-bg)"><b style="color:var(--ok)">7 a 10</b>Promoción</div><div style="background:var(--soft)"><b>4 a 6</b>Final</div><div style="background:var(--bad-bg)"><b style="color:var(--bad)">0 a 3</b>Insuficiente</div></div>
    </section>
    <section class="val"><h2>Nuestros valores</h2><div class="in">${VALORES.map(([n, t, d, img]) => `<div class="v"><span><h3>${t}</h3><div class="fila"><p>${d}</p><img class="${img}" src="img/${img}.png?v=5" alt=""></div></span></div>`).join("")}</div></section>
  </div>
  <section><h2 style="margin:0 0 12px;font-size:26px">Documentos</h2><div class="docs">
    ${DOCS.map(([k, t]) => esUrl(docs[k])
      ? `<a class="doc" href="${esc(docs[k])}" target="_blank" rel="noopener"><span class="ic">PDF</span><span class="t">${t}</span><b style="color:var(--link)">Abrir</b></a>`
      : `<div class="doc off" aria-disabled="true"><span class="ic">PDF</span><span class="t">${t}</span><span class="pill na">Aún no disponible</span></div>`).join("")}
  </div></section>
  <section class="card faq" style="padding-bottom:8px"><h2 style="font-size:26px;margin-bottom:8px">Preguntas frecuentes</h2>
    ${FAQ.map(([q, a], i) => `<details${i === 0 ? " open" : ""}><summary>${q}${CHEV}</summary><p>${a}</p></details>`).join("")}
  </section>
  <div class="row"><a class="btn" href="index.html">Volver al inicio</a></div>`;
});
</script>
</body>
</html>
